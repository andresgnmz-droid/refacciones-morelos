<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Automotriz Morelos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#142433; --ink-soft:#48607A; --ink-faint:#7C93A6;
    --bg:#EEF2F5; --surface:#FFFFFF; --surface-alt:#E4EAEF; --border:#D3DCE3;
    --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#DCEEF0;
    --shadow:0 1px 2px rgba(20,36,51,.06),0 4px 14px rgba(20,36,51,.07);
    --good:#0b8a0b; --warn:#b07400; --bad:#d63a39;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E7EDF2; --ink-soft:#9AB0C2; --ink-faint:#7C93A6;
      --bg:#0F1620; --surface:#182230; --surface-alt:#1F2C3C; --border:#2B3B4D;
      --accent:#35B6C2; --accent-ink:#06232A; --accent-soft:#163238;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
      --good:#2fbf2f; --warn:#d99a1a; --bad:#e66767;
    }
  }
  :root[data-theme="dark"]{
    --ink:#E7EDF2; --ink-soft:#9AB0C2; --ink-faint:#7C93A6;
    --bg:#0F1620; --surface:#182230; --surface-alt:#1F2C3C; --border:#2B3B4D;
    --accent:#35B6C2; --accent-ink:#06232A; --accent-soft:#163238;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
    --good:#2fbf2f; --warn:#d99a1a; --bad:#e66767;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;}
  h1,h2,h3{font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-weight:700;margin:0;letter-spacing:.2px;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  [hidden]{display:none !important;}

  .top{background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);position:relative;z-index:10;}
  .top-row{display:flex;align-items:center;gap:12px;padding:10px 16px;}
  .brand{display:flex;flex-direction:column;line-height:1.1;}
  .brand h1{font-size:19px;}
  .brand span{font-size:11px;color:var(--ink-faint);}
  .grow{flex:1;}
  .icon-btn{border:1px solid var(--border);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;}
  nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 0;scrollbar-width:thin;}
  nav button{border:0;background:transparent;color:var(--ink-soft);font-weight:600;font-size:13.5px;padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center;}
  nav button:hover{color:var(--ink);}
  nav button.on{color:var(--accent);border-bottom-color:var(--accent);}
  nav .lock{font-size:11px;}

  main{flex:1;min-height:0;position:relative;}
  .panel{position:absolute;inset:0;overflow:auto;}
  .panel iframe{width:100%;height:100%;border:0;display:block;background:var(--bg);}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px;}

  .hero h2{font-size:26px;}
  .hero p{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-top:4px;max-width:78ch;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;color:inherit;}
  .kpi:hover{border-color:var(--accent);}
  .kpi .l{font-size:11px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;}
  .kpi .v{font-family:'Barlow Semi Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1.1;}
  .kpi .s{font-size:12px;color:var(--ink-soft);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;}
  .card h3{font-size:17px;}
  .card p,.card li{font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
  .card ul{margin:0;padding-left:18px;}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);}
  .pill.warn{background:rgba(176,116,0,.15);color:var(--warn);}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;}
  .locked{border-style:dashed;}
  .sub{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .sub span{font-size:12.5px;border:1px solid var(--border);border-radius:10px;padding:6px 10px;color:var(--ink-faint);background:var(--bg);}
  .err{color:var(--bad);font-size:13px;}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><h1>ERP Automotriz Morelos</h1><span>Embotelladora Mexicana · Zona Morelos</span></div>
    <div class="grow"></div>
    <span id="estado" class="pill">Conectando…</span>
    <button class="icon-btn" id="tema" title="Cambiar tema">Tema</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<script>
(function(){
  "use strict";
  var SB_URL = "https://aoutudbxwawlnbwvypir.supabase.co";
  var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvdXR1ZGJ4d2F3bG5id3Z5cGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzQzNTMsImV4cCI6MjEwMTQ1MDM1M30.cfdjH9rwQDYyxrrKZIAw7JpcQKYcFWtiEYXEDF8fa_E";
  // Varios se mantiene bloqueado hasta que se concluya la parte de Varios (cambiar a false para liberarlo).
  var VARIOS_BLOQUEADO = true;

  var TABS = [
    { id:"inicio", t:"Inicio" },
    { id:"preventivos", t:"Preventivos", src:"preventivos.html" },
    { id:"correctivos", t:"Correctivos", src:"carga-mecanicos.html" },
    { id:"hojalateria", t:"Hojalatería y Pintura", src:"hojalateria.html" },
    { id:"piso", t:"Unidades en piso", src:"unidades-piso.html" },
    { id:"varios", t:"Varios", lock:VARIOS_BLOQUEADO },
    { id:"historial", t:"Histórico y respaldo", src:"historial.html" },
    { id:"ajustes", t:"Ajustes" }
  ];
  var VARIOS_ITEMS = [
    { t:"Combustible", src:"rendimientos.html" },
    { t:"Control de llantas" },
    { t:"Catálogo de refacciones", src:"index.html" },
    { t:"Catálogo de unidades", src:"catalogo-maestro.html" },
    { t:"Horas extras" },
    { t:"Recursos" }
  ];

  var nav = document.getElementById("nav"), main = document.getElementById("main");
  var panels = {};

  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

  function api(path, extra){
    var h = { apikey:SB_KEY, Authorization:"Bearer "+SB_KEY };
    if(extra) for(var k in extra) h[k]=extra[k];
    return fetch(SB_URL+"/rest/v1/"+path, { headers:h }).then(function(r){
      if(!r.ok) throw new Error(path+" → "+r.status);
      return r;
    });
  }
  function json(path){ return api(path).then(function(r){ return r.json(); }); }
  function count(path){
    return api(path, { Prefer:"count=exact", Range:"0-0" }).then(function(r){
      var cr = r.headers.get("content-range") || "";
      var n = parseInt(cr.split("/")[1], 10);
      return isNaN(n) ? 0 : n;
    });
  }
  function fmtFecha(iso){
    try{ return new Date(iso).toLocaleString("es-MX", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }); }
    catch(e){ return iso || "—"; }
  }

  /* ---------- navegación ---------- */
  TABS.forEach(function(tab){
    var b = el("button", "", tab.t);
    b.dataset.id = tab.id;
    if(tab.lock){ var l = el("span","lock","🔒"); b.appendChild(l); }
    b.addEventListener("click", function(){ location.hash = tab.id; });
    nav.appendChild(b);
    var p = el("section","panel"); p.hidden = true; p.id = "p-"+tab.id;
    main.appendChild(p);
    panels[tab.id] = { tab:tab, node:p, loaded:false };
  });

  function show(id){
    if(!panels[id]) id = "inicio";
    TABS.forEach(function(t){ panels[t.id].node.hidden = (t.id !== id); });
    Array.prototype.forEach.call(nav.children, function(b){ b.classList.toggle("on", b.dataset.id === id); });
    var P = panels[id];
    if(!P.loaded){
      P.loaded = true;
      if(P.tab.src){
        var f = document.createElement("iframe");
        f.title = P.tab.t; f.src = P.tab.src;
        P.node.appendChild(f);
      } else if(id === "inicio") buildInicio(P.node);
      else if(id === "varios") buildVarios(P.node);
      else if(id === "ajustes") buildAjustes(P.node);
    }
  }
  window.addEventListener("hashchange", function(){ show(location.hash.slice(1)); });

  /* ---------- Inicio ---------- */
  function kpi(label, value, sub, goto){
    var b = el("button","kpi");
    b.appendChild(el("span","l",label));
    var v = el("span","v",value); b.appendChild(v);
    b.appendChild(el("span","s",sub));
    b.addEventListener("click", function(){ location.hash = goto; });
    return { node:b, set:function(val, s){ v.textContent = val; if(s!=null) b.lastChild.textContent = s; } };
  }

  function buildInicio(root){
    var w = el("div","wrap"); root.appendChild(w);
    var hero = el("div","hero");
    hero.appendChild(el("h2","","Resumen de la zona"));
    hero.appendChild(el("p","","Datos en vivo desde la base del ERP. Toca un indicador para abrir su módulo."));
    w.appendChild(hero);

    var row = el("div","kpi-row"); w.appendChild(row);
    var kU = kpi("Unidades activas","…","Catálogo maestro","varios");
    var kP = kpi("Cumplimiento preventivos","…","Último mes cargado","preventivos");
    var kH = kpi("Avance hojalatería","…","Cronograma vigente","hojalateria");
    var kS = kpi("Unidades en piso","…","Estado vigente","piso");
    var kD = kpi("Disponibilidad de flota","…","Activas menos en piso","piso");
    [kU,kP,kH,kS,kD].forEach(function(k){ row.appendChild(k.node); });
    kU.node.addEventListener("click", function(){ location.hash = VARIOS_BLOQUEADO ? "inicio" : "varios"; });

    var g = el("div","grid2"); w.appendChild(g);
    var cH = el("div","card"); cH.appendChild(el("h3","","Histórico y respaldo"));
    var pH = el("p","","Cargando estado del histórico…"); cH.appendChild(pH);
    var go = el("button","icon-btn","Abrir histórico y respaldo"); go.addEventListener("click", function(){ location.hash="historial"; });
    cH.appendChild(go); g.appendChild(cH);
    var cV = el("div","card locked"); cV.appendChild(el("h3","","Varios"));
    cV.appendChild(el("p","","En afinación; se libera al concluir los ajustes de la semana."));
    var pill = el("span","pill warn","Bloqueado"); cV.appendChild(pill);
    g.appendChild(cV);

    var estado = document.getElementById("estado");
    var fallos = 0;
    function fail(e){ fallos++; console.error(e); estado.textContent = "Sin conexión a datos"; estado.className = "pill warn"; }

    count("catalogo_unidades?activo=eq.true&select=economico").then(function(n){
      kU.set(String(n)); return count("unidades_piso?select=economico");
    }).then(function(piso){
      kS.set(String(piso));
      var act = parseInt(kU.node.querySelector(".v").textContent,10) || 0;
      kD.set(act ? (Math.round((1-piso/act)*1000)/10)+"%" : "—");
    }).catch(fail);

    json("preventivos_cargas?select=periodo&order=periodo.desc&limit=1").then(function(r){
      if(!r.length) return kP.set("—","Sin cargas");
      var per = r[0].periodo;
      return json("preventivos_programa?select=estatus&periodo=eq."+per+"&limit=2000").then(function(rows){
        var ins = rows.filter(function(x){return x.estatus==="inhabilitado";}).length;
        var rea = rows.filter(function(x){return x.estatus==="realizado";}).length;
        var den = rows.length - ins;
        kP.set(den ? (Math.round(rea/den*1000)/10)+"%" : "—", per.slice(0,7)+" · "+rea+" de "+den);
      });
    }).catch(fail);

    json("hojalateria_cronograma?select=estatus&limit=1000").then(function(rows){
      var rea = rows.filter(function(x){return (x.estatus||"").toUpperCase()==="REALIZADO";}).length;
      kH.set(rows.length ? (Math.round(rea/rows.length*1000)/10)+"%" : "—", rea+" de "+rows.length+" unidades");
    }).catch(fail);

    Promise.all([
      json("snapshots?select=tomado_at&order=tomado_at.desc&limit=1"),
      json("historial_cambios?select=cambiado_at&order=cambiado_at.desc&limit=1"),
      count("historial_cambios?select=id")
    ]).then(function(r){
      var s = r[0][0], c = r[1][0];
      pH.textContent = "Última foto semanal: " + (s ? fmtFecha(s.tomado_at) : "aún ninguna") +
        ". Último cambio registrado: " + (c ? fmtFecha(c.cambiado_at) : "ninguno") +
        ". Cambios guardados: " + r[2] + ".";
      if(!fallos){ estado.textContent = "En línea"; estado.className = "pill"; }
    }).catch(fail);
  }

  /* ---------- Varios (bloqueado) ---------- */
  function buildVarios(root){
    var w = el("div","wrap"); root.appendChild(w);
    var hero = el("div","hero");
    hero.appendChild(el("h2","","Varios"));
    hero.appendChild(el("p","", VARIOS_BLOQUEADO
      ? "Esta sección está bloqueada mientras se afinan los detalles. Se libera al concluir la semana."
      : "Herramientas complementarias."));
    w.appendChild(hero);
    var c = el("div","card locked");
    c.appendChild(el("h3","","Contenido de la sección"));
    var s = el("div","sub");
    VARIOS_ITEMS.forEach(function(it){
      if(VARIOS_BLOQUEADO || !it.src){ s.appendChild(el("span","",it.t + (it.src ? "" : " · pendiente"))); }
      else { var a = el("a","",it.t); a.href = it.src; a.target = "_blank"; a.style.cssText="font-size:12.5px;border:1px solid var(--border);border-radius:10px;padding:6px 10px;color:var(--accent);text-decoration:none;"; s.appendChild(a); }
    });
    c.appendChild(s);
    w.appendChild(c);
  }

  /* ---------- Ajustes ---------- */
  function buildAjustes(root){
    var w = el("div","wrap"); root.appendChild(w);
    var hero = el("div","hero");
    hero.appendChild(el("h2","","Ajustes del ERP"));
    hero.appendChild(el("p","","Usuarios, roles y permisos por pestaña."));
    w.appendChild(hero);
    var c = el("div","card");
    c.appendChild(el("h3","","Estado de permisos"));
    c.appendChild(el("p","","Hoy el control de acceso depende de la contraseña de cada herramienta; la base permite escritura pública en varias tablas. Los permisos reales por rol (Andrés, Beatriz, jefes de zona, gerencia) quedan para la fase con Supabase Auth."));
    c.appendChild(el("span","pill warn","Pendiente: Supabase Auth"));
    w.appendChild(c);
  }

  /* ---------- tema ---------- */
  document.getElementById("tema").addEventListener("click", function(){
    var r = document.documentElement;
    var dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    Array.prototype.forEach.call(document.querySelectorAll("iframe"), function(f){
      try{ f.contentDocument.documentElement.dataset.theme = r.dataset.theme; }catch(e){}
    });
  });

  show(location.hash.slice(1) || "inicio");
})();
</script>
<script src="offline.js"></script>
</body>
</html>
