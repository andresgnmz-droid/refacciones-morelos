<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Automotriz Morelos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="erp-auth.js"></script>
<script src="correctivos-lib.js"></script>
<style>
  :root{
    --ink:#142433; --ink-soft:#48607A; --ink-faint:#7C93A6;
    --bg:#EEF2F5; --surface:#FFFFFF; --surface-alt:#E4EAEF; --border:#D3DCE3;
    --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#DCEEF0;
    --shadow:0 1px 2px rgba(20,36,51,.06),0 4px 14px rgba(20,36,51,.07);
    --good:#0b8a0b; --warn:#b07400; --bad:#d63a39;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E7EDF2; --ink-soft:#9AB0C2; --ink-faint:#7C93A6;
      --bg:#0F1620; --surface:#182230; --surface-alt:#1F2C3C; --border:#2B3B4D;
      --accent:#35B6C2; --accent-ink:#06232A; --accent-soft:#163238;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
      --good:#2fbf2f; --warn:#d99a1a; --bad:#e66767;
    }
  }
  :root[data-theme="dark"]{
    --ink:#E7EDF2; --ink-soft:#9AB0C2; --ink-faint:#7C93A6;
    --bg:#0F1620; --surface:#182230; --surface-alt:#1F2C3C; --border:#2B3B4D;
    --accent:#35B6C2; --accent-ink:#06232A; --accent-soft:#163238;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
    --good:#2fbf2f; --warn:#d99a1a; --bad:#e66767;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;}
  h1,h2,h3{font-family:'Barlow Semi Condensed',system-ui,sans-serif;font-weight:700;margin:0;letter-spacing:.2px;}
  p{margin:0;}
  button,input,select{font-family:inherit;}
  button{cursor:pointer;}
  [hidden]{display:none !important;}

  /* acceso */
  #acceso{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:26px 24px;display:flex;flex-direction:column;gap:14px;}
  .login h1{font-size:26px;}
  .login .sub{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .login label{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px;}
  .login input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:15px;}
  .login .link{background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;padding:0;text-align:left;}
  .msg{font-size:13px;line-height:1.45;}
  .msg.err{color:var(--bad);}
  .msg.ok{color:var(--good);}

  .btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:10px;}
  .btn.ghost{background:transparent;color:var(--accent);}
  .btn.danger{background:transparent;border-color:var(--bad);color:var(--bad);}
  .btn.sm{padding:6px 10px;font-size:12.5px;}
  .btn:disabled{opacity:.55;cursor:wait;}

  /* app */
  #app{flex:1;min-height:0;display:flex;flex-direction:column;}
  .top{background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);position:relative;z-index:10;}
  .top-row{display:flex;align-items:center;gap:10px;padding:10px 16px;}
  .brand{display:flex;flex-direction:column;line-height:1.1;}
  .brand h1{font-size:19px;}
  .brand span{font-size:11px;color:var(--ink-faint);}
  .grow{flex:1;}
  .who{font-size:12.5px;color:var(--ink-soft);text-align:right;line-height:1.3;}
  .who b{color:var(--ink);display:block;font-size:13px;}
  .icon-btn{border:1px solid var(--border);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;}
  nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px;scrollbar-width:thin;}
  nav button{border:0;background:transparent;color:var(--ink-soft);font-weight:600;font-size:13.5px;padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center;}
  nav button:hover{color:var(--ink);}
  nav button.on{color:var(--accent);border-bottom-color:var(--accent);}
  main{flex:1;min-height:0;position:relative;}
  .panel{position:absolute;inset:0;overflow:auto;}
  .panel iframe{width:100%;height:100%;border:0;display:block;background:var(--bg);}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px;}

  .hero h2{font-size:26px;}
  .hero p{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-top:4px;max-width:78ch;}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;color:inherit;}
  .kpi:hover{border-color:var(--accent);}
  .kpi .l{font-size:11px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;}
  .kpi .v{font-family:'Barlow Semi Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1.1;}
  .kpi .s{font-size:12px;color:var(--ink-soft);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;}
  .card h3{font-size:17px;}
  .card p,.card li{font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
  .card ul{margin:0;padding-left:18px;}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;}
  .pill.warn{background:rgba(176,116,0,.15);color:var(--warn);}
  .pill.bad{background:rgba(214,58,57,.15);color:var(--bad);}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;}
  .locked{border-style:dashed;}
  .sub-items{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .sub-items span,.sub-items a{font-size:12.5px;border:1px solid var(--border);border-radius:10px;padding:6px 10px;color:var(--ink-faint);background:var(--bg);text-decoration:none;}
  .sub-items a{color:var(--accent);}

  /* subpestañas de Varios */
  .subnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
  .subnav a,.subnav span{font-size:13px;font-weight:600;border:1px solid var(--border);border-radius:10px;padding:6px 12px;text-decoration:none;white-space:nowrap;}
  .subnav a{color:var(--ink-soft);background:var(--bg);}
  .subnav a:hover{color:var(--ink);border-color:var(--accent);}
  .subnav a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .subnav span{color:var(--ink-faint);border-style:dashed;}
  .subbody{flex:1;min-height:0;position:relative;overflow:auto;}
  .subbody iframe{width:100%;height:100%;border:0;display:block;background:var(--bg);}
  .vcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
  a.card.vc{text-decoration:none;color:inherit;}
  a.card.vc:hover{border-color:var(--accent);}

  /* ajustes */
  .stabs{display:flex;gap:6px;flex-wrap:wrap;}
  .stabs button{border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);font-weight:600;font-size:13px;padding:8px 14px;border-radius:10px;}
  .stabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .tbl{overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  th{background:var(--surface-alt);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);padding:9px 12px;white-space:nowrap;position:sticky;top:0;}
  td{padding:8px 12px;border-top:1px solid var(--border);vertical-align:middle;}
  td.acts{white-space:nowrap;display:flex;gap:6px;flex-wrap:wrap;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .f label{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px;}
  .f input,.f select,.mat select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:13.5px;}
  .checks{display:flex;gap:10px;flex-wrap:wrap;}
  .checks label{font-size:13px;color:var(--ink-soft);display:flex;gap:5px;align-items:center;text-transform:none;letter-spacing:0;font-weight:500;margin:0;}
  .checks input{width:auto;}
  .mat select{padding:6px 8px;font-size:12.5px;min-width:96px;}
  .mat td.mod{min-width:230px;font-weight:500;}
  .mat tr.grp td{background:var(--surface-alt);font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;}
  .mat select.ch{border-color:var(--warn);background:rgba(176,116,0,.12);}
  .cargas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
  .carga-frame{height:70vh;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface);}
  .carga-frame iframe{width:100%;height:100%;border:0;}
  .dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .dlg .box{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
  .dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:10px 12px;font-size:15px;letter-spacing:.5px;word-break:break-all;}
</style>
</head>
<body>

<section id="acceso">
  <form class="login" id="formLogin" autocomplete="on">
    <div><h1>ERP Automotriz Morelos</h1><p class="sub">Embotelladora Mexicana · Zona Morelos</p></div>
    <div><label for="lUser">Usuario</label><input id="lUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div><label for="lPass">Contraseña</label><input id="lPass" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" id="bEntrar" type="submit">Entrar</button>
    <p class="msg" id="lMsg"></p>
    <button class="link" id="bActivar" type="button" hidden>Primer acceso: activar al administrador</button>
  </form>

  <form class="login" id="formActivar" hidden autocomplete="off">
    <div><h1>Activar administrador</h1><p class="sub">Se hace una sola vez. Necesitas el código de activación que dejaste en Supabase (Edge Functions · Secrets · SETUP_CODE).</p></div>
    <div><label for="aCodigo">Código de activación</label><input id="aCodigo" type="password" autocomplete="off" required></div>
    <div><label for="aUser">Usuario</label><input id="aUser" autocapitalize="none" spellcheck="false" placeholder="ej. agaytan" required></div>
    <div><label for="aNombre">Nombre completo</label><input id="aNombre" required></div>
    <div><label for="aPass">Contraseña (mínimo 8 caracteres)</label><input id="aPass" type="password" autocomplete="new-password" minlength="8" required></div>
    <button class="btn" id="bCrearAdmin" type="submit">Crear administrador y entrar</button>
    <p class="msg" id="aMsg"></p>
    <button class="link" id="bVolver" type="button">Volver al inicio de sesión</button>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand"><h1>ERP Automotriz Morelos</h1><span>Embotelladora Mexicana · Zona Morelos</span></div>
      <div class="grow"></div>
      <div class="who" id="who"></div>
      <button class="icon-btn" id="bCuenta" title="Mi cuenta">Mi cuenta</button>
      <button class="icon-btn" id="tema" title="Cambiar tema">Tema</button>
      <button class="icon-btn" id="bSalir">Salir</button>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
</div>

<script>
(function(){
  "use strict";
  var SB_URL = ERP.URL, SB_KEY = ERP.KEY;
  var FN = SB_URL + "/functions/v1/admin-usuarios";
  var sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  // Varios sigue bloqueado hasta cerrar los ajustes de la semana (cambiar a false para liberarlo).
  var VARIOS_BLOQUEADO = false; // el bloqueo ahora es por herramienta: activo:false en VARIOS_ITEMS
  var CEDIS = ["Cuernavaca","Cuautla","Jojutla","Puente de Ixtla","Axochiapan","Cocoyoc"];

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
  function norm(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, ""); }
  function emailDe(u){ return norm(u) + "@erp-morelos.local"; }
  function fmtFecha(iso){
    try{ return new Date(iso).toLocaleString("es-MX", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }); }
    catch(e){ return iso || "—"; }
  }
  function llamarFn(cuerpo){
    return fetch(FN, { method:"POST", headers:{ apikey:SB_KEY, Authorization:"Bearer " + (ERP.token() || SB_KEY), "Content-Type":"application/json" }, body:JSON.stringify(cuerpo) })
      .then(function(r){ return r.json().catch(function(){ return { error:"Respuesta no válida del servidor." }; }); });
  }
  function claveAleatoria(){
    var abc = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789", out = "", a = new Uint32Array(10);
    crypto.getRandomValues(a);
    for(var i = 0; i < a.length; i++) out += abc[a[i] % abc.length];
    return out;
  }

  /* ================= acceso ================= */
  var perfil = null;

  function mostrarAcceso(){
    $("app").hidden = true; $("acceso").hidden = false;
    $("formLogin").hidden = false; $("formActivar").hidden = true;
    llamarFn({ accion:"estado" }).then(function(r){
      $("bActivar").hidden = !(r && r.hayAdmin === false);
    }).catch(function(){});
  }

  $("formLogin").addEventListener("submit", function(e){
    e.preventDefault();
    var b = $("bEntrar"), m = $("lMsg"); b.disabled = true; m.className = "msg"; m.textContent = "Entrando…";
    sb.auth.signInWithPassword({ email: emailDe($("lUser").value), password: $("lPass").value }).then(function(r){
      if(r.error){
        m.className = "msg err";
        m.textContent = /Invalid login|credentials/i.test(r.error.message) ? "Usuario o contraseña incorrectos." : "No se pudo entrar: " + r.error.message;
        b.disabled = false; return;
      }
      return iniciarSesion().then(function(ok){
        b.disabled = false;
        if(!ok){ m.className = "msg err"; m.textContent = "Tu usuario no tiene acceso activo. Avisa al administrador."; }
      });
    }).catch(function(err){ b.disabled = false; m.className = "msg err"; m.textContent = "Sin conexión: " + err.message; });
  });

  $("bActivar").addEventListener("click", function(){ $("formLogin").hidden = true; $("formActivar").hidden = false; });
  $("bVolver").addEventListener("click", function(){ $("formLogin").hidden = false; $("formActivar").hidden = true; });
  $("formActivar").addEventListener("submit", function(e){
    e.preventDefault();
    var b = $("bCrearAdmin"), m = $("aMsg"); b.disabled = true; m.className = "msg"; m.textContent = "Creando…";
    llamarFn({ accion:"bootstrap", codigo:$("aCodigo").value, usuario:$("aUser").value, nombre:$("aNombre").value, password:$("aPass").value }).then(function(r){
      if(r.error){ m.className = "msg err"; m.textContent = r.error; b.disabled = false; return; }
      return sb.auth.signInWithPassword({ email: emailDe($("aUser").value), password: $("aPass").value }).then(function(s){
        b.disabled = false;
        if(s.error){ m.className = "msg err"; m.textContent = "Se creó la cuenta pero no se pudo entrar: " + s.error.message; return; }
        return iniciarSesion();
      });
    }).catch(function(err){ b.disabled = false; m.className = "msg err"; m.textContent = "Sin conexión: " + err.message; });
  });

  function iniciarSesion(){
    return sb.rpc("mi_sesion").then(function(r){
      if(r.error || !r.data){
        return sb.auth.signOut().then(function(){ try{ localStorage.removeItem("erp_perfil"); }catch(e){} return false; });
      }
      perfil = r.data;
      try{ localStorage.setItem("erp_perfil", JSON.stringify(perfil)); }catch(e){}
      arrancarApp();
      return true;
    });
  }

  function salir(){
    sb.auth.signOut().then(function(){
      try{ localStorage.removeItem("erp_perfil"); }catch(e){}
      var lim = (window.caches && caches.keys) ? caches.keys().then(function(ks){ return Promise.all(ks.filter(function(k){ return k.indexOf("erp-datos") === 0; }).map(function(k){ return caches.delete(k); })); }) : Promise.resolve();
      lim.then(function(){ location.hash = ""; location.reload(); });
    });
  }
  $("bSalir").addEventListener("click", salir);

  /* ================= permisos ================= */
  function nivel(m){ return (perfil && perfil.permisos && perfil.permisos[m]) || "oculto"; }
  function ve(m){ return nivel(m) !== "oculto"; }
  function esAdmin(){ return perfil && perfil.rol === "admin"; }

  var TABS = [
    { id:"inicio", t:"Inicio", visible:function(){ return true; } },
    { id:"mantenimiento", t:"Mantenimiento", visible:function(){ return MANT_ITEMS.some(function(it){ return ve(it.m); }); } },
    { id:"carga-trabajo", t:"Carga de trabajo", src:"carga-mecanicos.html", visible:function(){ return ve("carga_trabajo"); } },
    { id:"piso", t:"Unidades en piso", src:"unidades-piso.html", visible:function(){ return ve("piso"); } },
    { id:"varios", t:"Varios", visible:function(){ return ["combustible","llantas","catalogo_refacciones","control_refacciones","carta_peticion","catalogo_unidades","horas_extras"].some(ve); } },
    { id:"historial", t:"Histórico y respaldo", src:"historial.html", visible:function(){ return ve("historial"); } },
    { id:"ajustes", t:"Ajustes", visible:function(){ return nivel("ajustes") === "editar"; } }
  ];
  // Subpestañas de Mantenimiento (la portada es la primera).
  var MANT_ITEMS = [
    { id:"preventivos", t:"Preventivos", src:"preventivos.html", m:"preventivos" },
    { id:"correctivos", t:"Correctivos", src:"correctivos.html", m:"correctivos" },
    { id:"hojalateria", t:"Hojalatería y Pintura", src:"hojalateria.html", m:"hojalateria" }
  ];
  var VARIOS_ITEMS = [
    { id:"combustible", t:"Combustible", src:"rendimientos.html", m:"combustible", activo:false, d:"Rendimientos y cargas de combustible de la flota." },
    { id:"llantas", t:"Control de llantas", m:"llantas", activo:false, d:"Revisión mensual de profundidad de llantas, cámara y alarma de las unidades de reparto." },
    { id:"catalogo-refacciones", t:"Catálogo de refacciones", src:"catalogo-refacciones.html", m:"catalogo_refacciones", d:"Material por CEDIS (existencia, bloqueo, entradas y salidas) y semáforo de material sin salir." },
    { id:"control-refacciones", t:"Control de refacciones faltantes", src:"faltantes.html", m:"control_refacciones", d:"Faltantes: pedidos contra ingresos de SAP, por CEDIS." },
    { id:"carta-peticion", t:"Carta petición", src:"carta-peticion.html", m:"carta_peticion", d:"Genera la carta petición de dotación de combustible para SAP." },
    { id:"catalogo-unidades", t:"Catálogo de unidades", src:"catalogo-maestro.html", m:"catalogo_unidades", d:"Ficha maestra de las unidades de la zona." },
    { id:"horas-extras", t:"Horas extras", m:"horas_extras", activo:false, d:"Captura de horas extras por mecánico y semana." }
  ];
  function puedeAbrir(it){ return !!it.src && it.activo !== false && ve(it.m); }
  function temaIframe(f){
    var t = document.documentElement.dataset.theme; if(!t) return;
    f.addEventListener("load", function(){ try{ f.contentDocument.documentElement.dataset.theme = t; }catch(e){} });
  }

  var panels = {}, vistas = [], armada = false, obsoleto = false;

  function arrancarApp(){
    $("acceso").hidden = true; $("app").hidden = false;
    var rolTxt = (rolesTxt[perfil.rol] || perfil.rol);
    $("who").textContent = "";
    var b = el("b", "", perfil.nombre); $("who").appendChild(b); $("who").appendChild(document.createTextNode(rolTxt));
    if(!armada){
      armada = true;
      TABS.forEach(function(tab){
        var btn = el("button", "", tab.t); btn.dataset.id = tab.id;
        if(tab.lock) btn.appendChild(el("span", "", "🔒"));
        btn.addEventListener("click", function(){ location.hash = tab.id; });
        $("nav").appendChild(btn);
        var p = el("section", "panel"); p.hidden = true; p.id = "p-" + tab.id;
        $("main").appendChild(p);
        panels[tab.id] = { tab:tab, node:p, btn:btn, loaded:false, stale:false };
      });
      window.addEventListener("hashchange", function(){ mostrar(location.hash.slice(1)); });
    }
    TABS.forEach(function(t){ panels[t.id].btn.hidden = !t.visible(); });
    // limpiar contenido de una sesión anterior
    TABS.forEach(function(t){ var P = panels[t.id]; P.node.textContent = ""; P.loaded = false; });
    mostrar(location.hash.slice(1) || "inicio");
  }

  // La dirección es  #pestaña  o  #pestaña/subpestaña  (ej. #varios/control-refacciones).
  function mostrar(ruta){
    var partes = String(ruta || "").split("/"), id = partes[0], sub = partes[1] || "";
    // Direcciones de antes: #preventivos, #correctivos y #hojalateria ahora viven dentro de Mantenimiento.
    if(id === "preventivos" || id === "hojalateria"){ sub = id; id = "mantenimiento"; }
    else if(id === "correctivos"){ sub = "correctivos"; id = "mantenimiento"; }
    if(!panels[id] || !panels[id].tab.visible()) { id = "inicio"; sub = ""; }
    TABS.forEach(function(t){ panels[t.id].node.hidden = (t.id !== id); });
    TABS.forEach(function(t){ panels[t.id].btn.classList.toggle("on", t.id === id); });
    var P = panels[id];
    if(P.loaded && P.stale && (P.tab.src || id === "varios" || id === "mantenimiento")){ P.node.textContent = ""; P.loaded = false; P.setSub = null; }
    if(!P.loaded){
      P.loaded = true; P.stale = false;
      if(P.tab.src){
        var f = document.createElement("iframe"); f.title = P.tab.t; f.src = P.tab.src; temaIframe(f); P.node.appendChild(f);
      } else if(id === "inicio") buildInicio(P.node);
      else if(id === "varios") buildVarios(P.node);
      else if(id === "mantenimiento") buildMantenimiento(P.node);
      else if(id === "ajustes") buildAjustes(P.node);
    }
    if((id === "varios" || id === "mantenimiento") && P.setSub) P.setSub(sub);
  }
  function marcarObsoletos(){ TABS.forEach(function(t){ if(t.src || t.id === "varios" || t.id === "mantenimiento") panels[t.id].stale = true; }); panels.inicio.stale = false; }

  /* ================= Inicio ================= */
  function api(path, extra){
    return fetch(SB_URL + "/rest/v1/" + path, { headers: ERP.headers(extra) }).then(function(r){
      if(!r.ok) throw new Error(path + " → " + r.status);
      return r;
    });
  }
  function json(path){ return api(path).then(function(r){ return r.json(); }); }
  function count(path){
    return api(path, { Prefer:"count=exact", Range:"0-0" }).then(function(r){
      var n = parseInt((r.headers.get("content-range") || "").split("/")[1], 10);
      return isNaN(n) ? 0 : n;
    });
  }
  function kpi(label, value, sub, goto){
    var b = el("button", "kpi"); b.appendChild(el("span", "l", label));
    var v = el("span", "v", value); b.appendChild(v);
    var s = el("span", "s", sub); b.appendChild(s);
    b.addEventListener("click", function(){ location.hash = goto; });
    var gt = goto.split("/")[0]; if(gt === "preventivos" || gt === "hojalateria" || gt === "correctivos") gt = "mantenimiento";
    b.hidden = !panels[gt] || !panels[gt].tab.visible();
    return { node:b, set:function(val, sub2){ v.textContent = val; if(sub2 != null) s.textContent = sub2; } };
  }

  function buildInicio(root){

    var row = el("div", "kpi-row"); w.appendChild(row);
    var kP = kpi("Cumplimiento preventivos", "…", "Último mes cargado", "mantenimiento/preventivos");
    var kH = kpi("Avance hojalatería", "…", "Cronograma vigente", "mantenimiento/hojalateria");
    var kS = kpi("Unidades en piso", "…", "Corte vigente", "piso");

      count("catalogo_unidades?activo=eq.true&select=economico").then(function(n){ kU.set(String(n)); }).catch(fail);
    }
    json("preventivos_cargas?select=periodo&order=periodo.desc&limit=1").then(function(r){

      return json("preventivos_programa?select=estatus&periodo=eq." + per + "&limit=2000").then(function(rows){

        var rea = rows.filter(function(x){ return x.estatus === "realizado"; }).length;

        kP.set(den ? (Math.round(rea / den * 1000) / 10) + "%" : "—", per.slice(0,7) + " · " + rea + " de " + den);
      });
    }).catch(fail);
    json("hojalateria_cronograma?select=estatus&limit=1000").then(function(rows){
      var rea = rows.filter(function(x){ return (x.estatus || "").toUpperCase() === "REALIZADO"; }).length;
      kH.set(rows.length ? (Math.round(rea / rows.length * 1000) / 10) + "%" : "—", rea + " de " + rows.length + " unidades");
    }).catch(fail);
    json("unidades_piso_datos?select=corte,datos&id=eq.1").then(function(r){
      if(!r.length){ kS.set("—", "Sin corte cargado"); return; }
      var us = (r[0].datos && r[0].datos.units) || [];
      kS.set(String(us.length), "Corte " + r[0].corte);
    }).catch(function(){ kS.set("—", "Sin corte cargado"); });

    var g = el("div", "grid2"); w.appendChild(g);
    var cH = el("div", "card"); cH.appendChild(el("h3", "", "Histórico y respaldo"));
    var pH = el("p", "", "Cargando…"); cH.appendChild(pH);
    if(ve("historial")){
      var go = el("button", "btn ghost", "Abrir histórico y respaldo"); go.style.alignSelf = "flex-start";
      go.addEventListener("click", function(){ location.hash = "historial"; }); cH.appendChild(go);
      g.appendChild(cH);
      Promise.all([ json("snapshots?select=tomado_at&order=tomado_at.desc&limit=1"), json("historial_cambios?select=cambiado_at&order=cambiado_at.desc&limit=1"), count("historial_cambios?select=id") ]).then(function(r){
        pH.textContent = "Última foto semanal: " + (r[0][0] ? fmtFecha(r[0][0].tomado_at) : "aún ninguna") + ". Último cambio registrado: " + (r[1][0] ? fmtFecha(r[1][0].cambiado_at) : "ninguno") + ". Cambios guardados: " + r[2] + ".";
        if(estado.textContent === "Conectando…"){ estado.textContent = "En línea"; }
      }).catch(fail);
    }
    var cV = el("div", "card"); cV.appendChild(el("h3", "", "Varios"));

  /* ================= Mantenimiento ================= */
  // Una sola pestaña con portada (cumplimiento y gasto) y las subpestañas Preventivos, Correctivos y Hojalatería y Pintura.
  function mantVe(it){ return it.id === "preventivos" ? (ve("preventivos") || ve("cronograma_preventivos")) : ve(it.m); }
  var NOMBRE_MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  function etMes(m){ var p = String(m).split("-"); return NOMBRE_MES[+p[1] - 1] + " " + p[0]; }
  function pesos(n){ return "$" + Math.round(n || 0).toLocaleString("es-MX"); }
  function pct(a, b){ return b ? (Math.round(a / b * 1000) / 10) + "%" : "—"; }

  function buildMantenimiento(root){
    root.style.display = "flex"; root.style.flexDirection = "column"; root.style.overflow = "hidden";
    var nav = el("div", "subnav"), body = el("div", "subbody");
    root.appendChild(nav); root.appendChild(body);
    var items = MANT_ITEMS.filter(mantVe), enlaces = {}, actual = null;

    function enlace(txt, ruta){
      var a = el("a", "", txt); a.href = "#" + ruta;
      a.addEventListener("click", function(e){
        if(e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
        e.preventDefault(); location.hash = ruta;
      });
      return a;
    }
    enlaces[""] = enlace("Portada", "mantenimiento"); nav.appendChild(enlaces[""]);
    items.forEach(function(it){ enlaces[it.id] = enlace(it.t, "mantenimiento/" + it.id); nav.appendChild(enlaces[it.id]); });

    function portada(){
      var w = el("div", "wrap");
      var hero = el("div", "hero");
      hero.appendChild(el("h2", "", "Mantenimiento"));
      hero.appendChild(el("p", "", "Cumplimiento y gasto de Preventivos, Correctivos y Hojalatería y Pintura. Toca una tarjeta para abrir su detalle."));
      w.appendChild(hero);
      var fb = el("div", "subnav"); fb.style.cssText = "padding:0;border:0;background:transparent";
      var lbl = el("span", "", "Mes:"); lbl.style.border = "0";
      var sel = el("select"); sel.style.cssText = "padding:7px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px";
      fb.appendChild(lbl); fb.appendChild(sel); w.appendChild(fb);
      var cuerpo = el("div", "vcards"); w.appendChild(cuerpo);
      var nota = el("p", "msg"); nota.style.color = "var(--ink-faint)"; w.appendChild(nota);
      var D = {};

      function tarjeta(titulo, sub, dest, filas){
        var c = el("a", "card vc"); c.href = "#" + dest;
        c.addEventListener("click", function(e){ if(e.button !== 0 || e.ctrlKey || e.metaKey) return; e.preventDefault(); location.hash = dest; });
        c.appendChild(el("h3", "", titulo)); if(sub) c.appendChild(el("p", "", sub));
        filas.forEach(function(f){
          var k = el("div"); k.style.cssText = "display:flex;flex-direction:column;gap:2px;margin-top:4px";
          k.appendChild(el("span", "", f[0])); k.firstChild.style.cssText = "font-size:11px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px";
          var v = el("span", "", f[1]); v.style.cssText = "font-family:'Barlow Semi Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1.1";
          k.appendChild(v); if(f[2]){ var sp = el("span", "", f[2]); sp.style.fontSize = "12px"; k.appendChild(sp); }
          c.appendChild(k);
        });
        return c;
      }

      function pintar(mes){
        cuerpo.textContent = ""; nota.textContent = "";
        var verP = items.some(function(i){ return i.id === "preventivos"; }), verC = items.some(function(i){ return i.id === "correctivos"; }), verH = items.some(function(i){ return i.id === "hojalateria"; });
        var C = D.corr, gP = 0, gC = 0, gH01 = 0, gH12 = 0;
        if(C){ gP = window.CORR.suma(C, "OM02", mes); gC = window.CORR.suma(C, "OM01", mes); }
        (D.hojMovs || []).forEach(function(m){
          if(String(m.fecha_documento || "").slice(0, 7) !== mes) return;
          var cl = D.hojClase[String(m.orden)], v = Number(m.importe || 0);
          if(cl === "OM01") gH01 += v; else if(cl === "OM12") gH12 += v;
        });
        var gH = gH01 + gH12;
        function nOrd(clase){ var o = {}; if(C) C.lineas.forEach(function(l){ if(l.clase === clase && l.mes === mes) o[l.orden] = 1; }); return Object.keys(o).length; }

        if(verP){
          var rows = (D.prev && D.prev[mes]) || null;
          var fP = [];
          if(rows){
            var ins = rows.filter(function(x){ return x.estatus === "inhabilitado"; }).length, rea = rows.filter(function(x){ return x.estatus === "realizado"; }).length;
            fP.push(["Cumplimiento", pct(rea, rows.length - ins), rea + " de " + (rows.length - ins) + " servicios"]);
          } else fP.push(["Cumplimiento", "—", "Aún no hay carga de este mes"]);
          fP.push(["Gasto", pesos(gP), nOrd("OM02") + " órdenes OM02"]);
          cuerpo.appendChild(tarjeta("Preventivos", etMes(mes), "mantenimiento/preventivos", fP));
        }
        if(verC) cuerpo.appendChild(tarjeta("Correctivos", etMes(mes) + " · solo órdenes OM01", "mantenimiento/correctivos", [["Gasto", pesos(gC), nOrd("OM01") + " órdenes" + (gH01 ? " · incluye " + pesos(gH01) + " de remosamiento" : "")]]));
        if(verH){
          var cr = D.crono || [], reaH = cr.filter(function(x){ return String(x.estatus || "").toUpperCase() === "REALIZADO"; }).length;
          cuerpo.appendChild(tarjeta("Hojalatería y Pintura", "Cronograma vigente · gasto de " + etMes(mes), "mantenimiento/hojalateria", [["Cumplimiento", pct(reaH, cr.length), reaH + " de " + cr.length + " unidades"], ["Remosamiento OM01", pesos(gH01), "presupuesto asignado · ya incluido en Correctivos"], ["Remosamiento OM12", pesos(gH12), "proyectos especiales"], ["Total remosamiento", pesos(gH), "OM01 + OM12"]]));
        }
        if(verP && verC && verH){
          var total = gP + gC + gH12;
          var t = el("div", "card"); t.style.gridColumn = "1 / -1";
          t.appendChild(el("h3", "", "Gasto total de mantenimiento · " + etMes(mes)));
          var big = el("div", "", pesos(total)); big.style.cssText = "font-family:'Barlow Semi Condensed',sans-serif;font-size:38px;font-weight:700;line-height:1.1"; t.appendChild(big);
          var tb = el("table"); tb.style.maxWidth = "520px";
          [["Preventivos (OM02)", gP, 0], ["Correctivos (OM01)", gC, 0], ["de los cuales remosamiento OM01 · presupuesto asignado (no se suma otra vez)", gH01, 1], ["Remosamiento OM12 · proyectos especiales", gH12, 0], ["Total", total, 2]].forEach(function(f){
            var tr = el("tr"); var a = el("td", "", f[0]); var b2 = el("td", "", pesos(f[1])); b2.style.textAlign = "right";
            if(f[2] === 1){ a.style.cssText = "padding-left:24px;color:var(--ink-faint);font-size:12.5px"; b2.style.color = "var(--ink-faint)"; b2.style.fontSize = "12.5px"; }
            if(f[2] === 2){ a.style.fontWeight = b2.style.fontWeight = "700"; }
            tr.appendChild(a); tr.appendChild(b2); tb.appendChild(tr);
          });
          t.appendChild(tb);
          cuerpo.insertBefore(t, cuerpo.firstChild);
          nota.textContent = "El gasto se cuenta en el mes en que se sacó el material (fecha de documento de SAP). Los remosamientos OM01 ya van dentro de Correctivos y también se muestran en Hojalatería, por eso no se suman otra vez; el remosamiento OM12 se suma aparte. OM03 no se incluye.";
        }
      }

      function pag(path){
        var out = [];
        function sig(off){ return json(path + "&limit=1000&offset=" + off).then(function(r){ out = out.concat(r); return r.length === 1000 ? sig(off + 1000) : out; }); }
        return sig(0);
      }

      // Datos en vivo
      var tareas = [];
      if(items.some(function(i){ return i.id === "preventivos"; })) tareas.push(json("preventivos_cargas?select=periodo&order=periodo.desc").then(function(cs){
        D.prev = {}; D.prevMeses = cs.map(function(c){ return c.periodo.slice(0, 7); });
        return Promise.all(cs.map(function(c){ return json("v_preventivos?select=estatus&periodo=eq." + c.periodo + "&limit=3000").then(function(r){ D.prev[c.periodo.slice(0, 7)] = r; }); }));
      }));
      if(items.some(function(i){ return i.id === "correctivos" || i.id === "preventivos"; })) tareas.push(json("correctivos_datos?select=datos&id=eq.1").then(function(r){ if(r[0]) D.corr = window.CORR.leer(r[0].datos); }));
      if(items.some(function(i){ return i.id === "hojalateria"; })) tareas.push(Promise.all([ json("hojalateria_cronograma?select=estatus&limit=1000"), pag("hojalateria_remo?select=orden,clase_orden&order=orden"), pag("hojalateria_remomov?select=orden,importe,fecha_documento&order=id") ]).then(function(r){
        D.crono = r[0]; D.hojClase = {}; r[1].forEach(function(x){ D.hojClase[String(x.orden)] = x.clase_orden; }); D.hojMovs = r[2];
      }));
      Promise.all(tareas).then(function(){
        var ms = {};
        (D.prevMeses || []).forEach(function(m){ ms[m] = 1; });
        ((D.corr && D.corr.meses) || []).forEach(function(m){ ms[m] = 1; });
        (D.hojMovs || []).forEach(function(r){ if(r.fecha_documento) ms[String(r.fecha_documento).slice(0, 7)] = 1; });
        var lista = Object.keys(ms).sort().reverse();
        if(!lista.length){ nota.textContent = "Todavía no hay información cargada."; return; }
        lista.forEach(function(m){ var o = el("option", "", etMes(m)); o.value = m; sel.appendChild(o); });
        sel.value = (D.prevMeses && D.prevMeses[0]) || lista[0];
        sel.addEventListener("change", function(){ pintar(sel.value); });
        pintar(sel.value);
      }).catch(function(e){ nota.className = "msg err"; nota.textContent = "No se pudo leer la información: " + e.message; });
      return w;
    }

    panels.mantenimiento.setSub = function(sub){
      var it = items.filter(function(x){ return x.id === sub; })[0];
      if(!it){ sub = ""; }
      if(actual === sub) return;
      actual = sub;
      Object.keys(enlaces).forEach(function(k){ enlaces[k].classList.toggle("on", k === sub); });
      body.textContent = "";
      if(it){
        var f = document.createElement("iframe"); f.title = it.t; f.src = it.src; temaIframe(f); body.appendChild(f);
      } else body.appendChild(portada());
    };
  }

  /* ================= Ajustes (solo administrador) ================= */
  var rolesTxt = {}, rolesLista = [], modulosLista = [];

  function cargarCatalogos(){
    return Promise.all([ json("roles?select=*&order=orden"), json("modulos?select=*&order=orden") ]).then(function(r){
      rolesLista = r[0]; modulosLista = r[1];
      rolesTxt = {}; rolesLista.forEach(function(x){ rolesTxt[x.rol] = x.descripcion; });
    });
  }

  function buildAjustes(root){
    var w = el("div", "wrap"); root.appendChild(w);
    var hero = el("div", "hero");
    hero.appendChild(el("h2", "", "Panel de control"));
    hero.appendChild(el("p", "", "Aquí das de alta a los usuarios, decides qué puede hacer cada rol en cada pestaña y subes los Excel de actualización. Solo tú ves esta sección."));
    w.appendChild(hero);
    var tabs = el("div", "stabs"); w.appendChild(tabs);
    var cuerpo = el("div"); cuerpo.style.cssText = "display:flex;flex-direction:column;gap:14px"; w.appendChild(cuerpo);
    var secs = [ ["usuarios", "Usuarios", ajUsuarios], ["permisos", "Permisos por pestaña", ajPermisos], ["cargas", "Cargas de Excel", ajCargas] ];
    function ir(id){
      Array.prototype.forEach.call(tabs.children, function(b){ b.classList.toggle("on", b.dataset.id === id); });
      cuerpo.textContent = "";
      secs.filter(function(s){ return s[0] === id; })[0][2](cuerpo);
    }
    secs.forEach(function(s){ var b = el("button", "", s[1]); b.dataset.id = s[0]; b.addEventListener("click", function(){ ir(s[0]); }); tabs.appendChild(b); });
    cargarCatalogos().then(function(){ ir("usuarios"); }).catch(function(e){ cuerpo.appendChild(el("p", "msg err", "No se pudo leer roles y módulos: " + e.message)); });
  }

  /* ---- Usuarios ---- */
  function ajUsuarios(root){
    var top = el("div"); top.style.cssText = "display:flex;gap:10px;align-items:center;flex-wrap:wrap";
    var nuevo = el("button", "btn", "Nuevo usuario"); var msg = el("span", "msg"); top.appendChild(nuevo); top.appendChild(msg); root.appendChild(top);
    var tw = el("div", "tbl"); var t = el("table"); tw.appendChild(t); root.appendChild(tw);
    root.appendChild(el("p", "msg", "El alcance por CEDIS se guarda con cada usuario; por ahora los permisos se aplican por pestaña (no por CEDIS)."));

    function pintar(us){
      t.textContent = "";
      var th = el("thead"), hr = el("tr");
      ["Usuario","Nombre","Rol","Alcance","Estado","Último acceso",""].forEach(function(h){ hr.appendChild(el("th", "", h)); });
      th.appendChild(hr); t.appendChild(th);
      var tb = el("tbody");
      us.forEach(function(u){
        var tr = el("tr");
        tr.appendChild(el("td", "", u.usuario)); tr.appendChild(el("td", "", u.nombre)); tr.appendChild(el("td", "", rolesTxt[u.rol] || u.rol));
        tr.appendChild(el("td", "", (u.cedis && u.cedis.length) ? u.cedis.join(", ") : "Todos"));
        var st = el("td"); st.appendChild(el("span", "pill" + (u.activo ? "" : " bad"), u.activo ? "Activo" : "Inactivo")); tr.appendChild(st);
        tr.appendChild(el("td", "", u.ultimo_acceso ? fmtFecha(u.ultimo_acceso) : "Nunca"));
        var ac = el("td", "acts");
        var e = el("button", "btn ghost sm", "Editar"); e.addEventListener("click", function(){ formUsuario(u); });
        var p = el("button", "btn ghost sm", "Contraseña"); p.addEventListener("click", function(){ formPassword(u); });
        ac.appendChild(e); ac.appendChild(p); tr.appendChild(ac); tb.appendChild(tr);
      });
      t.appendChild(tb);
    }
    function recargar(){
      msg.className = "msg"; msg.textContent = "Cargando…";
      llamarFn({ accion:"listar" }).then(function(r){
        if(r.error){ msg.className = "msg err"; msg.textContent = r.error; return; }
        msg.textContent = r.usuarios.length + " usuario(s)."; pintar(r.usuarios);
      }).catch(function(e){ msg.className = "msg err"; msg.textContent = "Sin conexión: " + e.message; });
    }

    function opcionesRol(sel, valor){
      rolesLista.forEach(function(r){ var o = el("option", "", r.descripcion); o.value = r.rol; if(r.rol === valor) o.selected = true; sel.appendChild(o); });
    }
    function checksCedis(valor){
      var wrap = el("div", "checks");
      CEDIS.forEach(function(c){
        var l = el("label"); var i = el("input"); i.type = "checkbox"; i.value = c; i.checked = (valor || []).indexOf(c) >= 0;
        l.appendChild(i); l.appendChild(document.createTextNode(c)); wrap.appendChild(l);
      });
      return wrap;
    }
    function leerCedis(wrap){ return Array.prototype.filter.call(wrap.querySelectorAll("input"), function(i){ return i.checked; }).map(function(i){ return i.value; }); }

    function formUsuario(u){
      dialogo(function(box, cerrar){
        box.appendChild(el("h3", "", u ? "Editar usuario" : "Nuevo usuario"));
        var fu = el("div", "f"); fu.appendChild(el("label", "", "Usuario (para entrar)")); var iu = el("input"); iu.autocapitalize = "none"; iu.value = u ? u.usuario : ""; iu.disabled = !!u; iu.placeholder = "ej. dsoler"; fu.appendChild(iu); box.appendChild(fu);
        var fn = el("div", "f"); fn.appendChild(el("label", "", "Nombre completo")); var inn = el("input"); inn.value = u ? u.nombre : ""; fn.appendChild(inn); box.appendChild(fn);
        var fr = el("div", "f"); fr.appendChild(el("label", "", "Rol")); var sr = el("select"); opcionesRol(sr, u ? u.rol : "mecanico"); fr.appendChild(sr); box.appendChild(fr);
        var fc = el("div", "f"); fc.appendChild(el("label", "", "Alcance por CEDIS (sin marcar = todos)")); var cc = checksCedis(u ? u.cedis : []); fc.appendChild(cc); box.appendChild(fc);
        var ip = null, fp = null;
        if(!u){
          fp = el("div", "f"); fp.appendChild(el("label", "", "Contraseña inicial (mínimo 8 caracteres)")); ip = el("input"); ip.value = claveAleatoria(); fp.appendChild(ip);
          var gen = el("button", "btn ghost sm", "Generar otra"); gen.type = "button"; gen.style.marginTop = "6px"; gen.addEventListener("click", function(){ ip.value = claveAleatoria(); }); fp.appendChild(gen);
          box.appendChild(fp);
        }
        var ia = null;
        if(u){
          var fa = el("div", "checks"); var la = el("label"); ia = el("input"); ia.type = "checkbox"; ia.checked = u.activo; la.appendChild(ia); la.appendChild(document.createTextNode("Usuario activo")); fa.appendChild(la); box.appendChild(fa);
        }
        var m = el("p", "msg"); box.appendChild(m);
        var row = el("div", "row"); var c = el("button", "btn ghost", "Cancelar"); var g = el("button", "btn", u ? "Guardar" : "Crear usuario");
        c.addEventListener("click", cerrar);
        g.addEventListener("click", function(){
          g.disabled = true; m.className = "msg"; m.textContent = "Guardando…";
          var cuerpo = u
            ? { accion:"actualizar", usuario:u.usuario, nombre:inn.value, rol:sr.value, cedis:leerCedis(cc), activo:ia.checked }
            : { accion:"crear_usuario", usuario:iu.value, nombre:inn.value, rol:sr.value, cedis:leerCedis(cc), password:ip.value };
          llamarFn(cuerpo).then(function(r){
            g.disabled = false;
            if(r.error){ m.className = "msg err"; m.textContent = r.error; return; }
            if(!u){
              box.textContent = "";
              box.appendChild(el("h3", "", "Usuario creado"));
              box.appendChild(el("p", "msg", "Entrégale estos datos. Puede cambiar su contraseña en “Mi cuenta”."));
              box.appendChild(el("div", "code", "Usuario: " + norm(iu.value) + "\nContraseña: " + ip.value)).style.whiteSpace = "pre-wrap";
              var r2 = el("div", "row"); var ok = el("button", "btn", "Listo"); ok.addEventListener("click", function(){ cerrar(); recargar(); }); r2.appendChild(ok); box.appendChild(r2);
            } else { cerrar(); recargar(); }
          });
        });
        row.appendChild(c); row.appendChild(g);
        if(u){
          var del = el("button", "btn danger", "Eliminar"); del.addEventListener("click", function(){
            if(!confirm("¿Eliminar a " + u.nombre + "? Esta acción no se puede deshacer. Si solo quieres quitarle el acceso, desactívalo.")) return;
            llamarFn({ accion:"eliminar", usuario:u.usuario }).then(function(r){ if(r.error){ m.className = "msg err"; m.textContent = r.error; } else { cerrar(); recargar(); } });
          });
          row.insertBefore(del, row.firstChild);
        }
        box.appendChild(row);
      });
    }
    function formPassword(u){
      dialogo(function(box, cerrar){
        box.appendChild(el("h3", "", "Nueva contraseña para " + u.nombre));
        var f = el("div", "f"); f.appendChild(el("label", "", "Contraseña (mínimo 8 caracteres)")); var i = el("input"); i.value = claveAleatoria(); f.appendChild(i); box.appendChild(f);
        var m = el("p", "msg"); box.appendChild(m);
        var row = el("div", "row"); var c = el("button", "btn ghost", "Cancelar"); var g = el("button", "btn", "Cambiar");
        c.addEventListener("click", cerrar);
        g.addEventListener("click", function(){
          g.disabled = true;
          llamarFn({ accion:"cambiar_password", usuario:u.usuario, password:i.value }).then(function(r){
            g.disabled = false;
            if(r.error){ m.className = "msg err"; m.textContent = r.error; }
            else { m.className = "msg ok"; m.textContent = "Listo. Entrégale la nueva contraseña: " + i.value; }
          });
        });
        row.appendChild(c); row.appendChild(g); box.appendChild(row);
      });
    }
    nuevo.addEventListener("click", function(){ formUsuario(null); });
    recargar();
  }

  /* ---- Permisos ---- */
  function ajPermisos(root){
    var card = el("div", "card"); root.appendChild(card);
    card.appendChild(el("h3", "", "Qué puede hacer cada rol en cada pestaña"));
    card.appendChild(el("p", "", "Editar: puede subir o cambiar información. Ver: solo consulta. Oculto: no ve la pestaña. El administrador siempre puede editar todo."));
    var m = el("p", "msg"); var guardar = el("button", "btn", "Guardar cambios"); guardar.disabled = true; guardar.style.alignSelf = "flex-start";
    var tw = el("div", "tbl mat"); var t = el("table"); tw.appendChild(t);
    card.appendChild(tw); card.appendChild(guardar); card.appendChild(m);
    var original = {}, cambios = {};
    json("permisos?select=*&limit=1000").then(function(rows){
      rows.forEach(function(r){ original[r.rol + "|" + r.modulo] = r.nivel; });
      var th = el("thead"), hr = el("tr"); hr.appendChild(el("th", "", "Pestaña"));
      rolesLista.forEach(function(r){ hr.appendChild(el("th", "", r.descripcion)); });
      th.appendChild(hr); t.appendChild(th);
      var tb = el("tbody"), grupo = null;
      modulosLista.forEach(function(mo){
        if(mo.grupo !== grupo){ grupo = mo.grupo; var gr = el("tr", "grp"); var gtd = el("td", "", grupo); gtd.colSpan = rolesLista.length + 1; gr.appendChild(gtd); tb.appendChild(gr); }
        var tr = el("tr"); tr.appendChild(el("td", "mod", mo.etiqueta));
        rolesLista.forEach(function(r){
          var td = el("td"); var k = r.rol + "|" + mo.modulo;
          var s = el("select"); [["editar","Editar"],["ver","Ver"],["oculto","Oculto"]].forEach(function(o){ var op = el("option", "", o[1]); op.value = o[0]; s.appendChild(op); });
          s.value = original[k] || "oculto";
          if(r.rol === "admin"){ s.value = "editar"; s.disabled = true; }
          s.addEventListener("change", function(){
            if(s.value === original[k]){ delete cambios[k]; s.classList.remove("ch"); } else { cambios[k] = s.value; s.classList.add("ch"); }
            var n = Object.keys(cambios).length; guardar.disabled = !n; m.className = "msg"; m.textContent = n ? n + " cambio(s) sin guardar." : "";
          });
          td.appendChild(s); tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
    }).catch(function(e){ m.className = "msg err"; m.textContent = "No se pudo leer la matriz: " + e.message; });
    guardar.addEventListener("click", function(){
      var filas = Object.keys(cambios).map(function(k){ var p = k.split("|"); return { rol:p[0], modulo:p[1], nivel:cambios[k] }; });
      guardar.disabled = true; m.className = "msg"; m.textContent = "Guardando…";
      ERP.rest("permisos?on_conflict=rol,modulo", { method:"POST", body:filas, prefer:"resolution=merge-duplicates,return=minimal" }).then(function(){
        filas.forEach(function(f){ original[f.rol + "|" + f.modulo] = f.nivel; });
        cambios = {}; Array.prototype.forEach.call(t.querySelectorAll("select.ch"), function(s){ s.classList.remove("ch"); });
        m.className = "msg ok"; m.textContent = "Permisos guardados. Cada persona los verá la próxima vez que entre.";
      }).catch(function(e){ guardar.disabled = false; m.className = "msg err"; m.textContent = "No se pudo guardar: " + e.message; });
    });
  }

  /* ---- Cargas de Excel ---- */
  function ajCargas(root){
    marcarObsoletos();
    var intro = el("div", "card");
    intro.appendChild(el("h3", "", "Cargas de Excel"));
    intro.appendChild(el("p", "", "Aquí subes los archivos con las modificaciones; las pestañas finales solo muestran la información ya limpia. Elige qué actualizar."));
    root.appendChild(intro);
    var grid = el("div", "cargas"); root.appendChild(grid);
    var visor = el("div"); root.appendChild(visor);

    function abrirFrame(src, titulo){
      visor.textContent = "";
      var h = el("h3", "", titulo); h.style.margin = "6px 0 8px"; visor.appendChild(h);
      var fr = el("div", "carga-frame"); var f = document.createElement("iframe"); f.src = src; f.title = titulo; fr.appendChild(f); visor.appendChild(fr);
      visor.scrollIntoView({ behavior:"smooth", block:"start" });
    }
    function tarjeta(titulo, desc, boton, accion, pendiente){
      var c = el("div", "card"); c.appendChild(el("h3", "", titulo)); c.appendChild(el("p", "", desc));
      if(pendiente){ c.appendChild(el("span", "pill warn", pendiente)); }
      if(boton){ var b = el("button", "btn", boton); b.style.alignSelf = "flex-start"; b.addEventListener("click", accion); c.appendChild(b); }
      grid.appendChild(c); return c;
    }
    tarjeta("Catálogo de unidades", "Excel mensual del catálogo (pestaña Morelos): altas, bajas y cambios.", "Subir archivo", function(){ abrirFrame("catalogo-maestro.html?modo=carga", "Catálogo de unidades"); });
    tarjeta("Hojalatería y Pintura", "Elige juntos Cronograma_Hojalateria.xlsx (Cronograma) y Correctivos.xlsx (Ordenes y MaterialOrden). También sirve el archivo anterior con CRONOGRAMA, Remo y Remomov.", "Subir archivo", function(){ abrirFrame("hojalateria.html?modo=carga", "Hojalatería y Pintura"); });
    tarjeta("Control de refacciones faltantes", "Archivo Faltante_Refacciones.xlsx, con las pestañas Pedidos e Ingresos (la pestaña Salidas no se usa aquí).", "Subir archivo", function(){ abrirFrame("faltantes.html?modo=carga", "Control de refacciones faltantes"); });

    tarjeta("Carga de trabajo y Correctivos", "Archivo Correctivos.xlsx de SAP con las pestañas Avisos, Ordenes, MaterialOrden y Puestos (también se aceptan los nombres anteriores). Es el mismo archivo para las dos pestañas: Carga de trabajo y Correctivos (solo OM01). Reemplaza la información vigente.", "Subir archivo", function(){ abrirFrame("carga-mecanicos.html?modo=carga", "Carga de trabajo y Correctivos"); });
    tarjeta("Unidades en piso", "Elige juntos Unidades_en_piso.xlsx (UnidadesPiso y Cargas), Faltante_Refacciones.xlsx (Pedidos, Ingresos y Salidas) Correctivos.xlsx e Historico_Ordenes.xlsx (Ordenes y MaterialOrden; el histórico completa el material surtido). También funciona el archivo anterior de seis pestañas. Reemplaza el corte vigente.", "Subir archivo", function(){ abrirFrame("piso-carga.html", "Unidades en piso"); });

    tarjeta("Preventivos", "Archivo Preventivos_AAAA-MM.xlsx con las pestañas MMCV, MMCU, MMJO, MMPU, MMAX y MMCC, Ordenes y MaterialOrden (antes Ordmov); también sirven los nombres anteriores. Reemplaza lo cargado de ese mes.", "Subir archivo", function(){ abrirFrame("preventivos-carga.html", "Preventivos"); });
    tarjeta("Catálogo de refacciones", "Archivo Catalogo_Refacciones.xlsx, con Indice, Stock, Bloqueos (antes Codbloq) y las pestañas UESMCV, UESMCU, UESMJO, UESMPU, UESMAX y UESMCC. Se cura al subirlo y reemplaza el corte vigente.", "Subir archivo", function(){ abrirFrame("catalogo-refacciones.html?modo=carga", "Catálogo de refacciones"); });
    tarjeta("Stock de refacciones", "CSV de existencias de SAP.", "Abrir carga", function(){ abrirFrame("index.html", "Stock de refacciones"); });
  }

  /* ================= tema ================= */
  $("tema").addEventListener("click", function(){
    var r = document.documentElement;
    var dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    Array.prototype.forEach.call(document.querySelectorAll("iframe"), function(f){ try{ f.contentDocument.documentElement.dataset.theme = r.dataset.theme; }catch(e){} });
  });

  /* ================= arranque ================= */
  cargarCatalogos().catch(function(){}).then(function(){
    return sb.auth.getSession();
  }).then(function(r){
    if(r && r.data && r.data.session){
      return iniciarSesion().then(function(ok){ if(!ok) mostrarAcceso(); });
    }
    mostrarAcceso();
  }).catch(function(){ mostrarAcceso(); });
})();
</script>
<script src="offline.js"></script>
</body>
