<style>

      <div class="sub" id="sub"></div>

<script>
let DATA=null;
const CEDIS_ALL=["Cuernavaca","Cuautla","Jojutla","Puente de Ixtla","Axochiapan","Cocoyoc"];
const ZONAS={JUAN:{n:"Zona Juan",resp:"Juan Daniel Soler",cedis:["Cuernavaca","Jojutla","Puente de Ixtla"]},DAVID:{n:"Zona David",resp:"José David Muñiz",cedis:["Cuautla","Axochiapan","Cocoyoc"]}};
const zonaDe=c=>ZONAS.JUAN.cedis.includes(c)?"JUAN":"DAVID";
let CORTE=0;const DAY=86400000;
const HOY=new Date().toISOString().slice(0,10);
const ST={sol:"Solicitada, sin pedido",ped:"Pedida, por llegar",par:"Llegó parcial",lleg:"Llegó, sin surtir a la unidad",sal:"Surtida a la unidad"};
const UST={sin:"Sin pedidos desde su ingreso",esp:"Esperando material",ok:"Material completo",adm:"Detenida por trámite",nd:"Sin información disponible"};
const STG={sol:"Sin solicitar material",ped:"Esperando pedido (compras)",lleg:"Esperando llegada del proveedor",sur:"En almacén, sin surtir a la unidad",rep:"Material surtido, en reparación"};
const MOTIVOS=["Refacción","Mano de obra","Servicio externo","Diagnóstico","Gestoría","Corralón","Otro"];
const CLS={OM01:"Correctivo",OM02:"Preventivo",OM03:"OM03",OM12:"OM12"};
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T=s=>Date.parse(s+"T00:00:00Z");
const dd=(a,b)=>Math.round((T(b)-T(a))/DAY);
const fmt=s=>{if(!s)return"—";const d=new Date(T(s));return d.getUTCDate()+" "+MES[d.getUTCMonth()]+" "+String(d.getUTCFullYear()).slice(2)};
const num=n=>Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
const money=n=>"$"+Math.round(n).toLocaleString("es-MX");

function categoria(f){
  if(/GESTOR/.test(f))return"Gestoría";
  if(/CORRAL/.test(f))return"Corralón";
  if(/AIRE/.test(f))return"Neumático (aire)";
  if(/GAS/.test(f))return"Gas LP";
  if(/VELOCIDADES|TRANSMISI|NO AVANZA/.test(f))return"Transmisión";
  if(/ARRANCA|APAGA|POTENCIA|MOTOR/.test(f))return"Motor";

}
const pend3=l=>["sol","ped","par"].includes(l.st);
function derive(u){
  const ov=OV[u.eco]||{};
  const ing=ov.ingreso||u.ingreso||null;
  const sv=SAL[u.eco];
  const salio=!!(sv&&(sv.ingreso||"")===(u.ingreso||""));
  const fsalida=salio?sv.fecha:null;
  const days=ing?Math.round(((salio?T(fsalida):CORTE)-T(ing))/DAY):null;
  const L=ing?u.lines.filter(l=>l.f>=ing):[];
  const prev=ing?u.lines.length-L.length:0;
  const M=ing?u.mats.filter(m=>m.f>=ing):[];
  const cat=categoria(u.falla);
  const adm=cat==="Gestoría"||cat==="Corralón";
  const state=adm?"adm":!ing?"nd":!L.length?"sin":L.some(pend3)?"esp":"ok";
  const cnt={sol:0,ped:0,par:0,lleg:0,sal:0};L.forEach(l=>cnt[l.st]++);
  const by=new Map();
  M.forEach(r=>{let g=by.get(r.m);if(!g){g={m:r.m,t:r.t,u:r.u,q:0,imp:0,ords:new Map(),last:r.f};by.set(r.m,g)}
    g.q+=r.q;g.imp+=r.i;g.ords.set(r.o,r.c);if(r.f>g.last)g.last=r.f});
  const mats=[...by.values()].filter(g=>Math.abs(g.q)>1e-9).sort((a,b)=>a.last<b.last?1:-1);
  const impTot=mats.reduce((s,g)=>s+g.imp,0);
  const corrAb=u.ords.filter(o=>o.ab&&o.c==="OM01");
  let slow=null;
  L.forEach(l=>{const pend=pend3(l);const d=Math.round(((pend||!l.fi?CORTE:T(l.fi))-T(l.f))/DAY);if(!slow||d>slow.d)slow={d,txt:l.txt,pend}});
  const lastArr=L.filter(l=>l.fi).map(l=>l.fl||l.fi).sort().pop()||null;
  const auto=adm?cat:state==="esp"?"Refacción":state==="ok"?"Mano de obra":"Por definir";
  /* tiempos del proceso: ingreso → 1ª solicitud → pedido → llegada → surtido */
  const tP=[],tL=[],tS=[];
  L.forEach(l=>{if(l.fp)tP.push(dd(l.f,l.fp));if(l.fi)tL.push(dd(l.fp||l.f,l.fi));if(l.fi&&l.fsal)tS.push(dd(l.fi,l.fsal))});
  const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):null;
  const f1=L.length?L.reduce((m,l)=>l.f<m?l.f:m,L[0].f):null;
  const dSol=(ing&&f1)?dd(ing,f1):null;
  let bott=null;
  if(!adm&&ing&&!salio){
    if(!L.length)bott={k:"sol",w:days};
    else{L.forEach(l=>{let k=null,w=0;
      if(l.st==="sol"){k="ped";w=dd(l.f,DATA.corte)}
      else if(l.st==="ped"||l.st==="par"){k="lleg";w=dd(l.fp||l.f,DATA.corte)}
      else if(l.st==="lleg"){k="sur";w=dd(l.fi||l.f,DATA.corte)}
      if(k&&(!bott||w>bott.w))bott={k,w}});
      if(!bott)bott={k:"rep",w:lastArr?dd(lastArr,DATA.corte):null}}}
  const proc={dSol,tP:avg(tP),tL:avg(tL),tS:avg(tS),f1,bott,
    pendSol:!L.length&&!!ing&&!adm,
    curP:L.some(l=>l.st==="sol"),curL:L.some(l=>l.st==="ped"||l.st==="par"),curS:L.some(l=>l.st==="lleg")};
  const d={...u,ing,days,manual:!!ov.ingreso,L,prev,M,state,cnt,mats,impTot,corrAb,slow,lastArr,motivo:ov.motivo||auto,motivoAuto:!ov.motivo,cat,adm,
    salio,fsalida,proc,dSol,tLbl:u.mec_hoja,
    mecLbl:adm?"Sin mecánico (trámite)":(u.mec||u.mec_hoja+" (sin cruce)"),alerts:[]};
  if(!salio){
    if(adm){if(days!=null&&days>=CFG.n4)d.alerts.push({k:"adm",sev:"info",lbl:`${cat} · ${days} d`,txt:`Detenida por ${cat.toLowerCase()} desde hace ${days} días. No es falla mecánica.`})}
    else{
      if(state==="sin"&&days>=CFG.n1)d.alerts.push({k:"sin",sev:"crit",lbl:`Sin pedidos · ${days} d`,txt:`Sin pedidos desde su ingreso; lleva ${days} días en piso.`});
      const atr=L.filter(l=>pend3(l)&&Math.round((CORTE-T(l.f))/DAY)>=CFG.n3);
      if(atr.length){const w=atr.map(l=>({l,d:Math.round((CORTE-T(l.f))/DAY)})).sort((a,b)=>b.d-a.d)[0];
        d.alerts.push({k:"atr",sev:"warn",lbl:`${atr.length>1?atr.length+" refacciones":"1 refacción"} sin llegar · ${w.d} d`,txt:`${atr.length>1?atr.length+" refacciones":"1 refacción"} sin llegar tras ${CFG.n3} días o más. La más tardada: ${w.l.txt.toLowerCase()} (${w.d} d${w.l.st==="sol"?", sin pedido":""}).`})}
      if(state==="ok"&&lastArr){const dl=Math.round((CORTE-T(lastArr))/DAY);
        if(dl>=CFG.n2)d.alerts.push({k:"ok",sev:"info",lbl:`Material completo · ${dl} d sin salir`,txt:`Material completo desde hace ${dl} días y la unidad sigue en piso${cnt.sal===L.length?" (todo ya surtido a la unidad)":" (hay material sin surtir a la unidad)"}.`})}
    }
  }
  return d;
}

function sorted(a){

  return s;
}

function zstats(key){

  const mecs=new Set(act.filter(u=>u.mec).map(u=>u.mec));

  return {key,flota,piso:act.length,mec:mec.length,tr:tr.length,
    dispT:flota?(1-act.length/flota)*100:null,dispM:flota?(1-mec.length/flota)*100:null,
    med:median(ds),p30:ds.length?ds.filter(d=>d>30).length/ds.length*100:null,
    dsol:median(mec.filter(u=>u.dSol!=null).map(u=>u.dSol)),sinSol:mec.filter(u=>u.state==="sin").length,
    ok:mec.filter(u=>u.state==="ok").length,nmec:mecs.size,porMec:mecs.size?mec.length/mecs.size:null,
    sal:sal.length,salMed:median(sal.map(u=>u.days)),alert:act.reduce((s,u)=>s+u.alerts.length,0),act};
}

function vGantt(){

function vHist(){
  const us=zoneUnits();
  const fal={};us.forEach(u=>{if(u.days==null)return;(fal[u.cat]=fal[u.cat]||[]).push(u)});
  const rows=Object.entries(fal).map(([k,a])=>({k,n:a.length,avg:Math.round(a.reduce((s,u)=>s+u.days,0)/a.length),max:Math.max(...a.map(u=>u.days)),ecos:a.map(u=>u.eco).join(", ")})).sort((a,b)=>b.avg-a.avg);
  const act=UNITS.filter(u=>!u.salio);
  const c={sin:0,esp:0,ok:0,adm:0,nd:0};act.forEach(u=>c[u.state]++);
  const live={corte:DATA.corte,total:act.length,...c,med:median(act.filter(u=>!u.adm).map(u=>u.days))};
  const list=[live,...SNAPS.filter(s=>s.corte!==DATA.corte)].sort((a,b)=>a.corte<b.corte?1:-1);
  const saved=SNAPS.some(s=>s.corte===DATA.corte);
  return `<div class="cols">
   <section class="panel box"><h3>Días en piso por tipo de falla</h3>
    <div class="scroll"><table class="ltab"><thead><tr><th>Tipo</th><th>Unidades</th><th>Promedio</th><th>Máximo</th></tr></thead><tbody>${rows.map(r=>`<tr><td title="${esc(r.ecos)}"><b>${esc(r.k)}</b></td><td class="mono">${r.n}</td><td class="mono">${r.avg} d</td><td class="mono">${r.max} d</td></tr>`).join("")}</tbody></table></div>
    <div class="note" style="margin-top:8px">Con un solo corte es una foto, no un histórico. Gestoría y corralón van aparte porque no son fallas mecánicas.</div></section>
   <section class="panel box"><h3>Cortes guardados</h3>
    <div class="scroll"><table class="ltab"><thead><tr><th>Corte</th><th>En piso</th><th>Sin pedidos</th><th>Esperando</th><th>Completo</th><th>Trámite</th><th>Mediana</th></tr></thead><tbody>${list.map(s=>`<tr><td class="mono nw">${fmt(s.corte)}${s.corte===DATA.corte&&!saved?' <span class="badge">sin guardar</span>':''}</td><td class="mono">${s.total}</td><td class="mono">${s.sin}</td><td class="mono">${s.esp}</td><td class="mono">${s.ok}</td><td class="mono">${s.adm??"—"}</td><td class="mono">${s.med==null?"—":s.med+" d"}</td></tr>`).join("")}</tbody></table></div>
    <div class="dctl" style="margin-top:8px"><button class="mini-btn" id="guardar">Guardar el corte del ${fmt(DATA.corte)}</button></div>
    <div class="note" style="margin-top:8px">Los cortes guardados se conservan en la base de datos del ERP para medir tiempos por tipo de falla y por mecánico. Solo quien administra esta pestaña puede guardar un corte.</div></section></div>`;
}
function vNotas(){
  return `<div class="cols">
  <section class="panel box"><h3>Reglas aplicadas</h3><ul>
   <li><b>Ingreso a taller</b>: fecha de la última carga en litros (<span class="tag">l</span>) de Cargas, sin límite de antigüedad. Sin carga: “Sin información disponible”. Se puede capturar la fecha real en cada unidad.</li>
   <li><b>Pedidos</b>: se ligan por “Número de necesidad” con el prefijo del centro (MMCV = MCV). Solo cuentan los solicitados el día del ingreso o después.</li>
   <li><b>Varios económicos en un pedido</b> (“1055-1090”): la línea cuenta completa para cada unidad y la cantidad se divide entre ellos.</li>
   <li><b>Cantidad base</b>: la pedida; si es 0 y ya hay pedido, la solicitada.</li>
   <li><b>Llegada</b>: ingresos 101 con el mismo pedido y material. Parcial si lo recibido es menor a lo pedido.</li>
   <li><b>Material surtido</b>: pestañas Uso y Usoc. Se toman las órdenes del equipo y el material con fecha de contabilización desde el ingreso. Las devoluciones restan.</li>
   <li><b>Surtida a la unidad</b>: la refacción pedida aparece cargada a una orden de la unidad después de llegar.</li>
   <li><b>Correctivo abierto</b>: orden OM01 cuyo estatus no empieza con CERR.</li>
   <li><b>Mecánico</b>: se cruza con la tabla de personal por alias y nombre de pila.</li>
   <li><b>Tiempos del proceso</b>: ingreso → 1ª solicitud (fecha de solicitud más temprana desde el ingreso), solicitud → pedido (fecha de pedido), pedido → llegada (primer ingreso 101) y llegada → surtido (primera salida cargada a la unidad).</li>
   <li><b>Gestoría y corralón</b>: si el diagnóstico de ingreso dice gestoría o corralón, la unidad se marca “Detenida por trámite”. No se mide en refacciones ni en los tiempos del proceso, y se separa en la disponibilidad.</li>
   <li><b>Ya salió de taller</b>: solo el administrador (dueño de este tablero) puede marcarlo. Se guarda en el tablero y lo ven todos. Si la unidad vuelve a entrar con otra fecha de ingreso, se vuelve a contar como en piso.</li>
   <li><b>Zonas</b>: Juan = Cuernavaca, Jojutla y Puente de Ixtla. David = Cuautla, Axochiapan y Cocoyoc. La flota sale del catálogo maestro.</li></ul></section>
  <section class="panel box"><h3>Por validar con este archivo</h3><ul>
   <li>MCV1291, MCV1286 y MCV1055 cargaron combustible hace 3 a 6 días y casi no tienen pedidos posteriores.</li>
   <li>MCV1009 queda en 461 días por su última carga de julio de 2025. Su balero llegó el 25 de agosto y nunca se cargó a una orden de la unidad.</li>
   <li>MCU2602 queda en 549 días por su última carga de abril de 2025.</li>
   <li>MCV1050 no tiene cargas; con la fecha capturada se calculan sus pedidos y su material.</li>
   <li>MCC6408 (gestoría) tiene fecha de ingreso por su última carga de combustible; confirma que ese día fue el ingreso.</li>
   <li>El material surtido incluye órdenes preventivas o de otro tipo que se abrieron durante la estancia. El filtro por clase de orden las separa.</li>
   <li>Una refacción que no aparece como surtida puede haberse usado sin cargarse a la orden de la unidad.</li></ul></section>
  <section class="panel box"><h3>Falta decidir</h3><ul>
   <li>Cómo medir la efectividad de cada zona con una sola calificación y qué peso lleva cada indicador.</li>
   <li>Si la disponibilidad debe contar toda la flota o solo las unidades de reparto y preventa.</li>
   <li>Cómo llegan los avisos: contador en la página y resumen para copiar ya están. Falta el aviso automático (push o correo) y a qué hora.</li>
   <li>Los umbrales de 3, 3, 7 y 15 días son de arranque. Ajústalos en la pestaña Alertas.</li>
   <li>Valores del motivo de espera: Refacción, Mano de obra, Servicio externo, Diagnóstico, Gestoría, Corralón y Otro.</li>
   <li>Fechas capturadas, motivos, umbrales y cortes se guardan solo en este navegador. Las salidas de taller sí se comparten. En el ERP todo iría a Supabase.</li></ul></section></div>`;
}
function render(){
  recompute();head();kpi();tabs();
  const v=document.getElementById("view");
  v.innerHTML=({unidades:vUnidades,proceso:vProceso,zonas:vZonas,gantt:vGantt,refs:vRefs,surtido:vSurtido,mec:vMec,alertas:vAlertas,hist:vHist,notas:vNotas})[tab]();
  v.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{fEstado=b.dataset.e;render()});
  v.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{fLinea=b.dataset.l;render()});
  v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{fClase=b.dataset.c;render()});
  v.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{gW=b.dataset.w==="todo"?"todo":+b.dataset.w;render()});
  v.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const k=b.dataset.u;open.has(k)?open.delete(k):open.add(k);render()});
  v.querySelectorAll("[data-fi]").forEach(i=>i.onchange=()=>{const k=i.dataset.fi;OV[k]=OV[k]||{};if(i.value)OV[k].ingreso=i.value;else delete OV[k].ingreso;saveOV(k);render()});
  v.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{const k=b.dataset.reset;if(OV[k])delete OV[k].ingreso;saveOV(k);render()});
  v.querySelectorAll("[data-mo]").forEach(s=>s.onchange=()=>{const k=s.dataset.mo;OV[k]=OV[k]||{};OV[k].motivo=s.value;saveOV(k);render()});
  v.querySelectorAll("[data-moreset]").forEach(b=>b.onclick=()=>{const k=b.dataset.moreset;if(OV[k])delete OV[k].motivo;saveOV(k);render()});
  v.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>marcarSalida(b.dataset.out));
  v.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>deshacerSalida(b.dataset.undo));
  const o=document.getElementById("ord");if(o){o.value=sortBy;o.onchange=()=>{sortBy=o.value;render()}}
  const qi=document.getElementById("q");if(qi)qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)};
  ["n1","n2","n3","n4"].forEach(id=>{const e=document.getElementById(id);if(e)e.onchange=()=>{CFG[id]=Math.max(0,+e.value||0);lsSet("uep_cfg",CFG);render()}});
  const cp=document.getElementById("copiar");if(cp)cp.onclick=()=>{const ta=document.getElementById("resumen"),m=document.getElementById("copiado");
    const sel=()=>{ta.focus();ta.select();m.textContent="Texto seleccionado; cópialo con Ctrl+C."};
    try{navigator.clipboard.writeText(ta.value).then(()=>{m.textContent="Copiado."},sel)}catch(e){sel()}};
  if(!OWNER)v.querySelectorAll("[data-fi],[data-mo],[data-reset],[data-moreset],#guardar").forEach(e=>{e.disabled=true;e.title="Solo lo modifica quien administra esta pestaña"});
  const gu=document.getElementById("guardar");if(gu)gu.onclick=()=>{const act=UNITS.filter(u=>!u.salio);const c={sin:0,esp:0,ok:0,adm:0,nd:0};act.forEach(u=>c[u.state]++);
    SNAPS=SNAPS.filter(s=>s.corte!==DATA.corte).concat([{corte:DATA.corte,total:act.length,...c,med:median(act.filter(u=>!u.adm).map(u=>u.days))}]);saveSnap();render()};
}
/* ---------- Datos en Supabase (lee quien tenga acceso a la pestaña; escribe quien tenga permiso de edición) ---------- */
function errMsg(e){return /401|403|42501/.test(String(e&&e.message))?"Sin permiso para guardar en esta pestaña.":"No se pudo guardar. Intenta de nuevo."}
function saveOV(k){
  if(!OWNER)return;
  const o=OV[k]||{};DBMSG="";
  const p=(!o.ingreso&&!o.motivo)
    ?ERP.rest("unidades_piso_ajustes?eco=eq."+encodeURIComponent(k),{method:"DELETE",prefer:"return=minimal"})
    :ERP.rest("unidades_piso_ajustes?on_conflict=eco",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:[{eco:k,ingreso:o.ingreso||null,motivo:o.motivo||null,updated_at:new Date().toISOString()}]});
  p.catch(e=>{DBMSG=errMsg(e);render()});
}
function saveSnap(){
  if(!OWNER)return;
  const r=SNAPS.find(s=>s.corte===DATA.corte);if(!r)return;DBMSG="";
  ERP.rest("unidades_piso_cortes?on_conflict=corte",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:[{corte:r.corte,resumen:r}]}).catch(e=>{DBMSG=errMsg(e);render()});
}
function marcarSalida(eco){
  if(!OWNER)return;
  const u=DATA.units.find(x=>x.eco===eco);const el=document.getElementById("fs-"+eco);
  const f=(el&&el.value)||HOY;DBMSG="";
  const reg={eco,ingreso:u.ingreso||"",fecha:f,at:new Date().toISOString()};
  SAL[eco]=reg;render();
  ERP.rest("unidades_piso_salidas?on_conflict=eco",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:[reg]}).catch(e=>{delete SAL[eco];DBMSG=errMsg(e);render()});
}
function deshacerSalida(eco){
  if(!OWNER)return;DBMSG="";
  const prev=SAL[eco];delete SAL[eco];render();
  ERP.rest("unidades_piso_salidas?eco=eq."+encodeURIComponent(eco),{method:"DELETE",prefer:"return=minimal"}).catch(e=>{SAL[eco]=prev;DBMSG=errMsg(e);render()});
}
function vacio(msg){
  ["sub","stamp","zonas","kpi","tabs"].forEach(id=>{document.getElementById(id).innerHTML=""});
  document.getElementById("view").innerHTML='<section class="panel" style="padding:28px 22px"><h3>'+esc(msg)+'</h3><p class="muted" style="margin:8px 0 0">'+(OWNER?"Sube el corte desde Ajustes → Cargas de Excel → Unidades en piso.":"El administrador debe cargar el corte vigente.")+'</p></section>';
}
async function cargar(primera){
  try{
    const [dat,sal,aj,cor]=await Promise.all([
      ERP.rest("unidades_piso_datos?select=corte,datos&id=eq.1"),
      ERP.rest("unidades_piso_salidas?select=*"),
      ERP.rest("unidades_piso_ajustes?select=*"),
      ERP.rest("unidades_piso_cortes?select=resumen&order=corte")]);
    SAL={};(sal||[]).forEach(r=>{SAL[r.eco]=r});
    OV={};(aj||[]).forEach(r=>{OV[r.eco]={};if(r.ingreso)OV[r.eco].ingreso=r.ingreso;if(r.motivo)OV[r.eco].motivo=r.motivo});
    SNAPS=(cor||[]).map(r=>r.resumen);
    if(!dat||!dat.length||!dat[0].datos||!dat[0].datos.units){DATA=null;vacio("Todavía no hay un corte de unidades en piso");return}
    DATA=dat[0].datos;DATA.corte=DATA.corte||dat[0].corte;
    CORTE=Date.parse(DATA.corte+"T00:00:00Z");DBMSG="";
    render();
  }catch(e){
    if(!DATA)vacio("No se pudo leer la información: "+(e.message||e));
    else{DBMSG="No se pudo actualizar desde la base de datos.";render()}
  }
}
OWNER=ERP.puede("piso");
cargar(true);
setInterval(()=>{const a=document.activeElement;if(!document.hidden&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))cargar(false)},60000);
</script>
