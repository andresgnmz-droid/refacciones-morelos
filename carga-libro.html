<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargar un libro completo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="erp-auth.js"></script>
<style>
  :root{
    --ink:#142433; --ink-soft:#48607A; --bg:#EEF2F5; --surface:#FFFFFF; --surface-alt:#E4EAEF; --border:#D3DCE3;
    --accent:#0E7C86; --accent-ink:#FFFFFF; --good:#1b7443; --warn:#9a5b00; --bad:#bf2a2a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E7EDF2; --ink-soft:#9AB0C2; --bg:#0F1620; --surface:#182230; --surface-alt:#1F2C3C; --border:#2B3B4D;
      --accent:#35B6C2; --accent-ink:#06232A; --good:#59d08c; --warn:#f2b44d; --bad:#ff7a72;
    }
  }
  :root[data-theme="dark"]{ --ink:#E7EDF2; --ink-soft:#9AB0C2; --bg:#0F1620; --surface:#182230; --surface-alt:#1F2C3C; --border:#2B3B4D; --accent:#35B6C2; --accent-ink:#06232A; --good:#59d08c; --warn:#f2b44d; --bad:#ff7a72; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
  .col{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
  h2{margin:0;font-size:20px} h3{margin:0;font-size:15px}
  p{margin:0}
  .sub{color:var(--ink-soft)}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{min-height:1.2em} .msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
  .estado{font-size:12px;color:var(--ink-soft)}
  .estado.ok{color:var(--good)} .estado.err{color:var(--bad)}
  .panel iframe{width:100%;height:520px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
  details summary{cursor:pointer;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="col">
  <div class="card">
    <h2 id="titulo">Cargar un libro completo</h2>
    <p class="sub" id="desc"></p>
    <div class="row">
      <input type="file" id="fArch" accept=".xlsx,.xlsm" hidden>
      <button class="btn" id="bElegir" type="button">Elegir el libro</button>
      <span id="nombre" class="sub"></span>
      <label class="sub"><input type="checkbox" id="revisar"> Revisar antes de guardar</label>
    </div>
    <div class="msg" id="cMsg"></div>
    <div id="lista"></div>
  </div>
  <div id="paneles" class="col"></div>
</div>

<script>
(function(){
"use strict";
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function norm(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim().toLowerCase(); }
function porId(doc,id){ return doc.getElementById(id); }
function txt(doc,id){ var e=doc.getElementById(id); return e?e.textContent:""; }
function visible(doc,id){ var e=doc.getElementById(id); return !!e && !e.hidden; }

/* Cada módulo: página que ya sabe leer sus pestañas, el campo de archivo de esa página, las pestañas que necesita
   (cada entrada es una lista de nombres posibles) y cómo saber que ya terminó de leer el archivo. */
function cls(d,id){ var e=d.getElementById(id); return e?e.className:""; }
/* lectura terminada / lectura correcta / terminó de guardar (ok, err o aún nada) para cada tipo de página */
var T_MSG={
  listo:function(d){ return /ok|err/.test(cls(d,"cMsg")); },
  leido:function(d){ return /\bok\b/.test(cls(d,"cMsg")); },
  fin:function(d){ var t=txt(d,"cMsg"), c=cls(d,"cMsg"); if(/\bok\b/.test(c)&&/^(Listo|El ERP ya tiene)/.test(t)) return "ok"; if(/\berr\b/.test(c)||/No se pudo guardar|Pon la fecha|Elige el mes/.test(t)) return "err"; return null; },
  texto:function(d){ return txt(d,"cMsg"); }
};
var T_STATUS={
  listo:function(d){ return visible(d,"diffPreview") || /No se|No pude/.test(txt(d,"statusBox")); },
  leido:function(d){ return visible(d,"diffPreview"); },
  fin:function(d){ var c=cls(d,"statusBox"); if(/\bok\b/.test(c)) return "ok"; if(/\berr\b/.test(c)&&/Listo|Error|No se pudo|permiso/.test(txt(d,"statusBox"))&&!visible(d,"diffPreview")) return "err"; if(/\berr\b/.test(c)) return "err"; return null; },
  texto:function(d){ return txt(d,"statusBox"); }
};
var T_CT={
  listo:function(d){ return /leído|No se pudo|Falta/.test(txt(d,"fileMeta")); },
  leido:function(d){ return /leído:/.test(txt(d,"fileMeta")) && !!d.getElementById("bGuardar2"); },
  fin:function(d){ var t=txt(d,"fileMeta"); if(/^Listo\./.test(t)) return "ok"; if(/No se pudo guardar|Pon la fecha/.test(t)) return "err"; return null; },
  texto:function(d){ return txt(d,"fileMeta"); }
};
var LIBROS={
  mantenimiento:{
    titulo:"Libro de mantenimiento (ERP_Mantenimiento.xlsx)",
    modulos:[
      { t:"Unidades en piso", u:"piso-carga.html", i:"#fArch", btn:"#bGuardar", needs:[["UnidadesPiso","UPiso"],["Cargas"]], f:T_MSG },
      { t:"Carga de trabajo y Correctivos", u:"carga-mecanicos.html?modo=carga", i:"#fileInput", btn:"#bGuardar2", needs:[["Avisos","Operaciones"],["Ordenes","OM01OM02"],["MaterialOrden","OM01OM02mov"]], f:T_CT },
      { t:"Preventivos", u:"preventivos-carga.html", i:"#fArch", btn:"#bGuardar", needs:[["MMCV","Cuernavaca"],["MMCU","Cuautla"]], f:T_MSG },
      { t:"Hojalatería y Pintura", u:"hojalateria.html?modo=carga", i:"#fileInput", btn:"#btnConfirm", needs:[["CronogramaHojalateria","Cronograma","CRONOGRAMA"],["Ordenes","Remo"],["MaterialOrden","Remomov"]], f:T_STATUS },
      { t:"Control de refacciones faltantes", u:"faltantes.html?modo=carga", i:"#fArch", btn:"#bGuardar", needs:[["Pedidos"],["Ingresos"]], f:T_MSG }
    ]
  },
  catalogos:{
    titulo:"Libro de catálogos (ERP_Catalogos.xlsx)",
    modulos:[
      { t:"Catálogo de refacciones", u:"catalogo-refacciones.html?modo=carga", i:"#fArch", btn:"#bGuardar", needs:[["Indice"],["Stock"]], f:T_MSG },
      { t:"Catálogo de unidades", u:"catalogo-maestro.html?modo=carga", i:"#fileInput", btn:"#btnConfirm", needs:[["Unidades","Morelos"]], f:T_STATUS },
      { t:"Cronograma de mantenimientos", u:"cronograma-carga.html", i:"#fArch", btn:"#bGuardar", needs:[["CUERNAVACA"],["CUAUTLA"],["COCOYOC"]], f:T_MSG }
    ]
  }
};
var params=new URLSearchParams(location.search), LIBRO=LIBROS[params.get("libro")]||LIBROS.mantenimiento;
$("titulo").textContent=LIBRO.titulo;
$("desc").textContent="Elige el libro una sola vez: se lee y se guarda todo lo que trae. Al final ves el resultado de cada sección. Si prefieres ver cada resumen antes de guardar, marca la casilla.";
document.title=LIBRO.titulo;

function tiene(nombres, hojas){ return nombres.some(function(n){ return hojas.indexOf(norm(n))>=0; }); }
function esperar(cond, ms, paso){
  return new Promise(function(ok){
    var t0=Date.now();
    (function vuelta(){ var r=false; try{ r=cond(); }catch(e){ r=false; } if(r) return ok(true); if(Date.now()-t0>ms) return ok(false); setTimeout(vuelta,paso||400); })();
  });
}
function cargarModulo(mod, file, host, revisar, resultados){
  return new Promise(function(ok){
    var card=document.createElement("div"); card.className="card panel";
    card.innerHTML='<div class="row" style="justify-content:space-between"><h3>'+esc(mod.t)+'</h3><span class="estado">Abriendo…</span></div>';
    var fr=document.createElement("iframe"); fr.title=mod.t; card.appendChild(fr); host.appendChild(card);
    var est=card.querySelector(".estado");
    function listo(clase,msg,estadoRes){ est.className="estado "+clase; est.textContent=msg; resultados.push({ t:mod.t, estado:estadoRes, msg:msg }); ok(); }
    fr.addEventListener("load",function(){
      var win=fr.contentWindow, doc=fr.contentDocument;
      win.confirm=function(){ return true; };     /* se confirma solo: ya elegiste el libro y, si quisiste, revisaste */
      var t=document.documentElement.dataset.theme; if(t) doc.documentElement.dataset.theme=t;
      esperar(function(){ return !!doc.querySelector(mod.i) && !doc.querySelector(mod.i).disabled; }, 20000).then(function(h){
        var inp=doc.querySelector(mod.i);
        if(!h||!inp) return listo("err","No pude abrir esta sección.","err");
        est.textContent="Leyendo el libro…";
        var dt=new win.DataTransfer(); dt.items.add(new win.File([file],file.name,{type:file.type}));
        inp.files=dt.files; inp.dispatchEvent(new win.Event("change",{bubbles:true}));
        esperar(function(){ return mod.f.listo(doc); }, 300000, 500).then(function(fin){
          if(!fin) return listo("err","Tardó demasiado en leer el libro.","err");
          if(!mod.f.leido(doc)) return listo("err","No se guardó: "+(mod.f.texto(doc)||"no se pudo leer").slice(0,200),"err");
          if(revisar) return listo("ok","Listo: revisa el resumen y pulsa Guardar en este panel.","revisar");
          var b=doc.querySelector(mod.btn);
          if(!b||b.disabled) return listo("err","No se guardó: el botón de guardar no está disponible (¿tu usuario puede editar esta sección?).","err");
          est.textContent="Guardando…"; b.click();
          esperar(function(){ return mod.f.fin(doc)!==null; }, 300000, 500).then(function(fin2){
            var r=fin2?mod.f.fin(doc):null, m=(mod.f.texto(doc)||"").slice(0,220);
            if(r==="ok") listo("ok","Guardado. "+m,"ok"); else listo("err","No se guardó: "+(m||"tardó demasiado"),"err");
          });
        });
      });
    });
    fr.src=mod.u;
  });
}
$("bElegir").addEventListener("click",function(){ $("fArch").click(); });
$("fArch").addEventListener("change",function(){
  var f=this.files[0]; if(!f) return; var inp=this;
  $("nombre").textContent=f.name; $("paneles").innerHTML=""; $("lista").innerHTML=""; $("cMsg").className="msg"; $("cMsg").textContent="Leyendo las pestañas de "+f.name+"…";
  $("bElegir").disabled=true;
  var rd=new FileReader();
  rd.onload=function(){
    var wb; try{ wb=XLSX.read(new Uint8Array(rd.result),{type:"array",bookSheets:true}); }catch(e){ $("cMsg").className="msg err"; $("cMsg").textContent="No pude abrir el archivo como Excel."; $("bElegir").disabled=false; inp.value=""; return; }
    var hojas=wb.SheetNames.map(norm);
    var aplican=[], noAplican=[];
    LIBRO.modulos.forEach(function(m){
      var falta=m.needs.filter(function(n){ return !tiene(n,hojas); }).map(function(n){ return n[0]; });
      (falta.length?noAplican:aplican).push(falta.length?{m:m,falta:falta}:{m:m});
    });
    if(!aplican.length){ $("cMsg").className="msg err"; $("cMsg").textContent="Este archivo no trae las pestañas de ninguna sección de este libro. Pestañas encontradas: "+wb.SheetNames.join(", ")+"."; $("bElegir").disabled=false; inp.value=""; return; }
    var h='<p><b>Se van a leer:</b> '+aplican.map(function(a){ return esc(a.m.t); }).join(", ")+'.</p>';
    if(noAplican.length) h+='<details><summary>No aplican a este libro ('+noAplican.length+')</summary><ul>'+noAplican.map(function(a){ return '<li>'+esc(a.m.t)+': faltan las pestañas '+esc(a.falta.join(", "))+'</li>'; }).join("")+'</ul></details>';
    $("lista").innerHTML=h;
    $("cMsg").textContent="Abriendo las secciones, una por una…";
    var cadena=Promise.resolve();
    var revisar=$("revisar").checked, resultados=[];
    aplican.forEach(function(a){ cadena=cadena.then(function(){ $("cMsg").textContent="Procesando: "+a.m.t+"…"; return cargarModulo(a.m,f,$("paneles"),revisar,resultados); }); });
    cadena.then(function(){
      var malas=resultados.filter(function(r){ return r.estado==="err"; });
      var h='<ul>'+resultados.map(function(r){ return '<li><b>'+esc(r.t)+':</b> '+esc(r.msg)+'</li>'; }).join("")+'</ul>';
      $("lista").insertAdjacentHTML("beforeend",'<div class="card" style="margin-top:8px"><h3>Resultado</h3>'+h+'</div>');
      if(revisar){ $("cMsg").className="msg ok"; $("cMsg").textContent="Listo. Revisa cada panel y pulsa Guardar en los que quieras actualizar."; }
      else if(malas.length){ $("cMsg").className="msg err"; $("cMsg").textContent="Terminó, pero "+malas.length+" sección(es) no se guardaron. Revisa el resultado."; }
      else { $("cMsg").className="msg ok"; $("cMsg").textContent="Listo: se guardó todo el libro."; }
      $("bElegir").disabled=false; inp.value="";
    });
  };
  rd.onerror=function(){ $("cMsg").className="msg err"; $("cMsg").textContent="No se pudo leer el archivo."; $("bElegir").disabled=false; };
  rd.readAsArrayBuffer(f);
});
})();
</script>
<script src="offline.js"></script>
</body>
</html>
